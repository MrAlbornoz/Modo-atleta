<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Modo Atleta">

<title>Modo Atleta — Federico</title>
<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --page:#f9f9f7;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-text:#006300;
  --accent:#2a78d6;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --surface-1:#1a1a19; --page:#0d0d0d;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --good-text:#0ca30c;
    --accent:#3987e5;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background:var(--page); color:var(--ink);
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
  font-size:17px; line-height:1.45;
}
header.app{
  position:sticky; top:0; z-index:20;
  background:var(--page);
  padding: calc(10px + env(safe-area-inset-top)) 20px 8px;
  display:flex; align-items:baseline; justify-content:space-between;
  border-bottom:1px solid var(--border);
}
header.app h1{font-size:20px; margin:0; letter-spacing:-0.02em;}
header.app .date{color:var(--muted); font-size:14px;}
main{max-width:840px; margin:0 auto; padding:16px 16px 32px;}
h2{font-size:22px; margin:18px 0 10px; letter-spacing:-0.02em;}
h3{font-size:17px; margin:16px 0 8px;}
.card{
  background:var(--surface-1); border:1px solid var(--border);
  border-radius:16px; padding:16px; margin:10px 0;
}
.card.tap{cursor:pointer;}
.card .sub{color:var(--ink-2); font-size:14px; margin-top:2px;}
.row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.row.between{justify-content:space-between;}
.pill{
  display:inline-block; font-size:12.5px; padding:3px 10px; border-radius:999px;
  border:1px solid var(--border); color:var(--ink-2); background:transparent;
}
.pill.blue{color:#fff; background:var(--s1); border-color:var(--s1);}
.pill.orange{color:#fff; background:var(--s2); border-color:var(--s2);}
.pill.warn{color:var(--ink); background:transparent; border-color:var(--warn);}
button{
  font-family:inherit; font-size:16px; border:none; border-radius:12px;
  padding:12px 16px; cursor:pointer; color:var(--ink);
  background:var(--surface-1); border:1px solid var(--border);
}
button.primary{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}
button.ghost{background:transparent;}
button.small{font-size:14px; padding:8px 12px; border-radius:10px;}
button.danger{color:var(--crit); border-color:var(--crit); background:transparent;}
button:active{opacity:.75;}
input,select,textarea{
  font-family:inherit; font-size:17px; color:var(--ink);
  background:var(--surface-1); border:1px solid var(--axis); border-radius:10px;
  padding:10px 12px; width:100%;
}
input[type=number]{text-align:center;}
label.f{display:block; font-size:13px; color:var(--ink-2); margin:10px 0 4px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
nav.tabs{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  display:flex; justify-content:space-around;
  background:var(--surface-1); border-top:1px solid var(--border);
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
}
nav.tabs button{
  flex:1; background:none; border:none; color:var(--muted);
  font-size:12px; padding:6px 2px; display:flex; flex-direction:column; align-items:center; gap:2px;
}
nav.tabs button .ico{font-size:22px; line-height:1;}
nav.tabs button.active{color:var(--accent); font-weight:600;}
.setrow{
  display:flex; align-items:center; gap:8px; padding:8px 0;
  border-bottom:1px solid var(--grid); font-variant-numeric:tabular-nums;
}
.setrow:last-child{border-bottom:none;}
.setrow .n{width:26px; color:var(--muted); font-size:14px;}
.setrow input{width:74px; padding:8px 6px;}
.setrow .x{color:var(--muted);}
.setrow button{padding:8px 12px;}
.prev{
  font-size:13.5px; color:var(--ink-2); background:var(--page);
  border-radius:8px; padding:6px 10px; margin:6px 0;
}
.hint{
  font-size:13.5px; border-left:3px solid var(--good); padding:6px 10px; margin:8px 0;
  color:var(--ink-2); background:var(--page); border-radius:0 8px 8px 0;
}
.hint.up{border-left-color:var(--s1);}
.safety{font-size:13px; color:var(--muted); margin-top:6px;}
.done{color:var(--good-text); font-weight:600;}
.timerbar{
  position:fixed; left:0; right:0; bottom:calc(64px + env(safe-area-inset-bottom)); z-index:40;
  background:var(--accent); color:#fff; display:none;
  align-items:center; justify-content:space-between; padding:12px 20px;
  font-variant-numeric:tabular-nums; font-size:18px; font-weight:600;
}
.timerbar button{background:rgba(255,255,255,.2); color:#fff; border:none;}
.kpi{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin:12px 0;}
.kpi .tile{background:var(--surface-1); border:1px solid var(--border); border-radius:14px; padding:12px 14px;}
.kpi .tile .v{font-size:26px; font-weight:700; letter-spacing:-0.02em;}
.kpi .tile .l{font-size:12.5px; color:var(--muted); margin-top:2px;}
.chartbox{background:var(--surface-1); border:1px solid var(--border); border-radius:16px; padding:14px; margin:12px 0;}
.chartbox h3{margin:0 0 4px;}
.chartbox .sub{font-size:13px; color:var(--muted); margin-bottom:8px;}
svg text{font-family:inherit;}
.legend{display:flex; gap:16px; font-size:13px; color:var(--ink-2); margin-top:6px; flex-wrap:wrap;}
.legend .sw{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px;}
.checkitem{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--grid); cursor:pointer;}
.checkitem:last-child{border-bottom:none;}
.checkitem .box{
  width:26px; height:26px; border-radius:8px; border:2px solid var(--axis);
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; flex:none;
}
.checkitem.on .box{background:var(--good); border-color:var(--good);}
.checkitem .t{flex:1;}
.checkitem .d{font-size:13px; color:var(--muted);}
.banner{
  border:1px solid var(--warn); border-radius:12px; padding:10px 14px; margin:10px 0;
  font-size:14px; color:var(--ink-2);
}
.sessionhead{display:flex; justify-content:space-between; align-items:center; gap:10px; margin:8px 0;}
.histset{font-size:14.5px; color:var(--ink-2); font-variant-numeric:tabular-nums;}
details{margin:4px 0;}
summary{cursor:pointer;}
textarea{min-height:70px;}
.exdone{opacity:.55;}
.tag1rm{font-size:12.5px; color:var(--muted);}
a{color:var(--accent);}
.tooltip{
  position:absolute; pointer-events:none; background:var(--ink); color:var(--page);
  font-size:12.5px; padding:4px 8px; border-radius:6px; white-space:nowrap; z-index:50;
  transform:translate(-50%,-130%); display:none; font-variant-numeric:tabular-nums;
}
</style>

<script>
"use strict";
/* ============================================================
   MODO ATLETA — Federico Albornoz
   v1.0 — 5 agosto 2026
   Registro de fuerza + cardio. Plan Fase 1 precargado.
   Reglas fijas: sin carga axial (L2–S1) · exhalar en el esfuerzo ·
   la FC manda sobre el número · bandas por tensión, no libras ·
   progresión por 1RM estimado, no volumen total.
   ============================================================ */

const APP_VERSION = "1.0";
const LS_KEY = "modoAtleta_v1";

/* ---------- Rutinas precargadas (Plan Fase 1, equipo de casa) ----------
   modes: w = peso+reps · bw = corporal (reps, lastre opcional) ·
   band = banda (tensión+reps) · hold = isométrico (segundos) ·
   carry = acarreo (peso + pasos/metros)
   Inventario: mancuernas 5·10·15·20·25·35·40·50·60 lb (50/60 desde 3-ago),
   EZ bar ~180 lb máx, dips/pull-up bar, TRX, bandas, bancos, BOSU. */
const DB_STEPS = [5,10,15,20,25,35,40,50,60];

const ROUTINES = [
{
  id:"A", name:"Fuerza A — Empuje", color:"blue",
  note:"Exhala en el esfuerzo. Sin carga axial. 2–3 reps en reserva.",
  exercises:[
    {id:"floorpress", name:"Floor Press — EZ Bar", mode:"w", sets:3, reps:[8,10], startW:155,
     tip:"29-jul: 3×10 × 155 lb (topado por discos). Progresa con tempo/pausas hasta ~180."},
    {id:"dip", name:"Chest Dip (paralelas)", mode:"bw", sets:3, reps:[6,10],
     tip:"A 226 lb de corporal es tu mejor carga de empuje. Cero carga axial."},
    {id:"incpress", name:"DB Incline Press", mode:"w", sets:3, reps:[8,12], startW:40,
     tip:"Con las nuevas de 50/60: salto 40→50 es +25%. Sube reps antes que peso."},
    {id:"latraise", name:"DB Lateral Raise", mode:"w", sets:3, reps:[10,15], startW:15},
    {id:"triband", name:"Tríceps con banda", mode:"band", sets:3, reps:[12,15],
     tip:"Registra color/tensión de la banda + distancia al anclaje."},
    {id:"calf", name:"Elevación de talones ⭐", mode:"w", sets:3, reps:[20,25], startW:50,
     tip:"PRIORIDAD sarcopenia (pantorrilla 14\"). Nunca saltarla."}
  ]
},
{
  id:"B", name:"Fuerza B — Tirón + Core", color:"blue",
  note:"La columna cuelga en dominadas — cero compresión. Pallof es HOLD, no reps.",
  exercises:[
    {id:"pullup", name:"Pull Up", mode:"bw", sets:3, reps:[4,6],
     tip:"5 dominadas a 226 lb = fuerza relativa real."},
    {id:"dbrow", name:"DB Row (1 brazo, apoyado)", mode:"w", sets:3, reps:[8,10], startW:50,
     tip:"29-jul: 3×10 × 40. Con las de 50: baja reps a 8 y construye."},
    {id:"facepull", name:"Face Pull con banda", mode:"band", sets:3, reps:[15,15]},
    {id:"hipthrust", name:"DB Hip Thrust", mode:"w", sets:3, reps:[10,12], startW:50,
     tip:"Rey del glúteo sin cargar la columna."},
    {id:"ezcurl", name:"EZ-Bar Curl", mode:"w", sets:3, reps:[10,12], startW:25},
    {id:"pallof", name:"Pallof Press — HOLD", mode:"hold", sets:3, secs:30,
     tip:"~30 s por lado, banda 70 lb en loop. Anti-rotación = oro para L2–S1."}
  ]
},
{
  id:"C", name:"Fuerza C — Full body / Unilateral", color:"blue",
  note:"Unilateral: a una extremidad, 40–50 lb sí pesan. FC manda (el búlgaro dispara pulso).",
  exercises:[
    {id:"bss", name:"Bulgarian Split Squat", mode:"bw", sets:3, reps:[8,10], perSide:true,
     tip:"29-jul: corporal (226 lb) ya es carga real. Aquí sube más la FC — autorregula."},
    {id:"stepup", name:"Step-up al banco", mode:"w", sets:3, reps:[8,10], startW:20, perSide:true},
    {id:"dbbench", name:"DB Bench Press", mode:"w", sets:3, reps:[8,10], startW:40,
     tip:"16-jul: 40×12 'como si nada'. Toca probar las de 50."},
    {id:"rowuni", name:"Remo unilateral con apoyo", mode:"w", sets:3, reps:[8,10], startW:50, perSide:true},
    {id:"carry", name:"Suitcase Carry", mode:"carry", sets:3, reps:[40,40], startW:50,
     tip:"Anota peso + pasos por lado. Core anti-flexión lateral sin comprimir."},
    {id:"woodchop", name:"Wood Chop con banda", mode:"band", sets:3, reps:[10,12], perSide:true},
    {id:"calf2", name:"Elevación de talones ⭐", mode:"w", sets:3, reps:[20,25], startW:50,
     tip:"Va 2×/semana. Prioridad sarcopenia."}
  ]
},
{
  id:"M", name:"McGill Big 3 (diario)", color:"orange",
  note:"Antes de cualquier sesión. Espalda neutra siempre.",
  exercises:[
    {id:"curlup", name:"Curl-up modificado", mode:"bw", sets:3, reps:[8,10]},
    {id:"sideplank", name:"Side Plank — HOLD", mode:"hold", sets:3, secs:20, perSide:true},
    {id:"birddog", name:"Bird-dog", mode:"bw", sets:3, reps:[8,10], perSide:true}
  ]
}
];

/* Cardio types */
const CARDIO_TYPES = [
  {id:"zona2", name:"Zona 2 — MyRun", target:"3.0–3.5 mph · incl 4–12% · 40–50 min · FC 115–125",
   fields:["min","hrAvg","hrMax","speed","incline","dist","kcal"]},
  {id:"futbol", name:"Fútbol salón", target:"La percepción subestima — usa el dato del reloj. Sin síntomas = seguir; dolor torácico/mareo = parar.",
   fields:["min","hrAvg","hrMax","kcal"]},
  {id:"golf", name:"Golf", target:"Caminando si se puede. ¿Sustituto 0.0%? Anótalo en notas.",
   fields:["min","hrAvg","kcal"]},
  {id:"rampa", name:"Test de rampa VO₂max", target:"3.5 mph fijo · +2% incl cada 2 min · hasta ~150 bpm. Anota inclinación final + tiempo + FC final.",
   fields:["min","hrMax","incline","kcal"]},
  {id:"caminata", name:"Caminata", target:"Ritmo conversacional. Suma pasos.",
   fields:["min","hrAvg","dist","kcal"]},
  {id:"otro", name:"Otro cardio", target:"", fields:["min","hrAvg","hrMax","dist","kcal"]}
];
const CARDIO_FIELD_LABELS = {min:"Duración (min)", hrAvg:"FC promedio", hrMax:"FC máx",
  speed:"Velocidad (mph)", incline:"Inclinación (%)", dist:"Distancia (mi)", kcal:"Calorías"};

/* Checklist diario (del plan) */
const CHECKLIST = [
  {id:"mcgill", t:"McGill Big 3", d:"10 min — todos los días, sin excepción"},
  {id:"sesion", t:"Sesión programada", d:"Fuerza / Zona 2 / caminata"},
  {id:"prot", t:"Proteína 180–200 g", d:"2 merengadas NO negociables + 2 sólidas"},
  {id:"crea", t:"Creatina 5 g", d:"Todos los días, también en descanso"},
  {id:"pasos", t:"8,000+ pasos", d:"Meta: subir a 9,500"}
];

<script>
/* ---------- Estado ---------- */
let MEM_FALLBACK = false;
let memStore = null;
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ MEM_FALLBACK = true; }
  return memStore || {sessions:[], checklist:{}, settings:{restSec:90}, active:null};
}
function saveState(){
  S.settings = S.settings || {restSec:90};
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); MEM_FALLBACK=false; }
  catch(e){ MEM_FALLBACK = true; memStore = S; }
}
let S = loadState();
S.sessions = S.sessions || []; S.checklist = S.checklist || {};
S.settings = S.settings || {restSec:90};

function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(iso){
  const [y,m,d]=iso.split("-").map(Number);
  const dt=new Date(y,m-1,d);
  return dt.toLocaleDateString("es-ES",{weekday:"short", day:"numeric", month:"short"});
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function est1RM(w,r){ if(!w||!r) return 0; return Math.round(w*(1+r/30)); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* Última sesión donde aparece un ejercicio (para "la vez pasada") */
function lastPerf(exId, excludeSessionId){
  for(let i=S.sessions.length-1;i>=0;i--){
    const s=S.sessions[i];
    if(s.type!=="fuerza" || s.id===excludeSessionId) continue;
    const ex=(s.exercises||[]).find(e=>e.exId===exId);
    if(ex && ex.sets && ex.sets.length) return {date:s.date, sets:ex.sets};
  }
  return null;
}
function setLabel(mode,st){
  if(mode==="hold") return (st.s||0)+" s" + (st.band? " · "+st.band : "");
  if(mode==="band") return (st.band||"banda")+" × "+(st.r||0);
  if(mode==="carry") return (st.w||0)+" lb × "+(st.r||0)+" pasos";
  if(mode==="bw") return (st.w? "+"+st.w+" lb × " : "") + (st.r||0) + (st.w?"":" reps");
  return (st.w||0)+" lb × "+(st.r||0);
}
function nextDBStep(w){
  for(const s of DB_STEPS){ if(s>w) return s; }
  return null;
}

/* Sugerencia de progresión: todas las series al tope del rango → subir */
function progressionHint(exDef, last){
  if(!last) return null;
  const topReps = exDef.reps ? exDef.reps[1] : null;
  if(exDef.mode==="w"){
    const sets=last.sets.filter(s=>s.r);
    if(sets.length>=exDef.sets && sets.every(s=>s.r>=topReps)){
      const w=Math.max(...sets.map(s=>s.w||0));
      const nxt=nextDBStep(w);
      if(exDef.id==="floorpress") return "Todas las series al tope ("+topReps+"). Sube +5 lb en discos o añade pausa de 2 s abajo.";
      if(nxt && nxt-w>10) return "Todas al tope con "+w+" lb. El salto a "+nxt+" es grande (+"+(nxt-w)+"): prueba 1–2 series con "+nxt+" y completa con "+w+", o suma tempo 3-1-1.";
      if(nxt) return "Todas las series al tope con "+w+" lb → sube a "+nxt+" lb.";
      return "Techo del inventario ("+w+" lb): progresa con tempo, pausas o más series.";
    }
  }else if(exDef.mode==="bw"){
    const sets=last.sets.filter(s=>s.r);
    if(sets.length>=exDef.sets && sets.every(s=>s.r>=topReps))
      return "Todas al tope → suma 1–2 reps por serie o añade una 4ª serie.";
  }else if(exDef.mode==="hold"){
    const sets=last.sets.filter(s=>s.s);
    if(sets.length>=exDef.sets && sets.every(s=>s.s>=exDef.secs))
      return "Holds completos → sube 5 s por lado o acorta la banda.";
  }
  return null;
}
</script>
<script>
/* ---------- Timer de descanso ---------- */
const Timer = {
  int:null, end:0,
  start(sec){
    sec = sec || (S.settings.restSec||90);
    this.end = Date.now()+sec*1000;
    document.getElementById("timerbar").style.display="flex";
    clearInterval(this.int);
    this.int=setInterval(()=>this.tick(),250);
    this.tick();
  },
  tick(){
    const left=Math.max(0,Math.round((this.end-Date.now())/1000));
    const m=Math.floor(left/60), s=left%60;
    document.getElementById("timerCount").textContent=m+":"+String(s).padStart(2,"0");
    if(left<=0){
      this.stop();
      try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
      this.beep();
    }
  },
  stop(){ clearInterval(this.int); document.getElementById("timerbar").style.display="none"; },
  beep(){
    try{
      const ctx=new (window.AudioContext||window.webkitAudioContext)();
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=880; g.gain.value=0.15;
      o.start(); o.stop(ctx.currentTime+0.35);
    }catch(e){}
  }
};

/* ---------- Navegación ---------- */
let TAB="hoy";
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  TAB=b.dataset.tab; render();
});
function setActiveTab(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===TAB));
}
function render(){
  setActiveTab();
  document.getElementById("hdrDate").textContent = fmtDate(todayISO());
  const v=document.getElementById("view");
  if(TAB==="hoy") v.innerHTML=viewHoy();
  else if(TAB==="entrenar") v.innerHTML=viewEntrenar();
  else if(TAB==="historial") v.innerHTML=viewHistorial();
  else if(TAB==="progreso"){ v.innerHTML=viewProgreso(); drawCharts(); }
  else if(TAB==="datos") v.innerHTML=viewDatos();
  window.scrollTo(0,0);
}
</script>
<script>
/* ---------- VISTA: HOY ---------- */
function weekSessions(){
  const now=new Date(); const day=(now.getDay()+6)%7; // lunes=0
  const mon=new Date(now); mon.setDate(now.getDate()-day); mon.setHours(0,0,0,0);
  const monISO=mon.getFullYear()+"-"+String(mon.getMonth()+1).padStart(2,"0")+"-"+String(mon.getDate()).padStart(2,"0");
  let fuerza=0, cardio=0;
  for(const s of S.sessions){
    if(s.date>=monISO){
      if(s.type==="fuerza" && s.routineId!=="M") fuerza++;
      if(s.type==="cardio" && (s.cardio.kind==="zona2"||s.cardio.kind==="futbol"||s.cardio.kind==="rampa")) cardio++;
    }
  }
  return {fuerza,cardio};
}
function viewHoy(){
  const t=todayISO();
  const chk=S.checklist[t]||{};
  const wk=weekSessions();
  const todays=S.sessions.filter(s=>s.date===t);
  let h="";
  if(MEM_FALLBACK) h+='<div class="banner">⚠️ El almacenamiento no está disponible en esta vista — los datos NO se guardarán al cerrar. Abre la app en Safari y usa Exportar como respaldo.</div>';
  h+='<h2>Hoy</h2>';
  h+='<div class="kpi">'
    +'<div class="tile"><div class="v">'+wk.fuerza+'<span style="font-size:15px;color:var(--muted)">/3</span></div><div class="l">Fuerza esta semana</div></div>'
    +'<div class="tile"><div class="v">'+wk.cardio+'<span style="font-size:15px;color:var(--muted)">/2</span></div><div class="l">Zona 2 / fútbol</div></div>'
    +'<div class="tile"><div class="v">'+S.sessions.length+'</div><div class="l">Sesiones en el log</div></div>'
    +'</div>';
  if(todays.length){
    h+='<h3>Registrado hoy</h3>';
    for(const s of todays){
      h+='<div class="card"><div class="row between"><div><b>'+esc(s.name)+'</b>'
        +'<div class="sub">'+sessionSummary(s)+'</div></div><span class="done">✓</span></div></div>';
    }
  }
  h+='<h3>Checklist diario</h3><div class="card">';
  for(const c of CHECKLIST){
    const on=!!chk[c.id];
    h+='<div class="checkitem '+(on?"on":"")+'" onclick="toggleCheck(\''+c.id+'\')">'
      +'<div class="box">'+(on?"✓":"")+'</div>'
      +'<div class="t">'+c.t+'<div class="d">'+c.d+'</div></div></div>';
  }
  h+='</div>';
  h+='<div class="card"><b>Reglas de la casa</b>'
    +'<div class="safety">❌ Sin carga axial (L2–S1) · ❌ Sin impacto/correr · ✅ Exhalar en el esfuerzo · ✅ La FC manda sobre el número en la app · 🛑 Dolor torácico, disnea desproporcionada o mareo → parar y consultar.</div></div>';
  return h;
}
function toggleCheck(id){
  const t=todayISO();
  S.checklist[t]=S.checklist[t]||{};
  S.checklist[t][id]=!S.checklist[t][id];
  saveState(); render();
}
function sessionSummary(s){
  if(s.type==="cardio"){
    const c=s.cardio, ct=CARDIO_TYPES.find(x=>x.id===c.kind);
    let parts=[];
    if(c.min) parts.push(c.min+" min");
    if(c.hrAvg) parts.push("FC "+c.hrAvg);
    if(c.hrMax) parts.push("máx "+c.hrMax);
    if(c.incline) parts.push(c.incline+"%");
    if(c.kcal) parts.push(c.kcal+" kcal");
    return parts.join(" · ")||"—";
  }
  const nEx=(s.exercises||[]).filter(e=>e.sets.length).length;
  const nSets=(s.exercises||[]).reduce((a,e)=>a+e.sets.length,0);
  return nEx+" ejercicios · "+nSets+" series";
}
</script>
<script>
/* ---------- VISTA: ENTRENAR ---------- */
function viewEntrenar(){
  if(S.active) return viewActiveSession();
  let h='<h2>Entrenar</h2><h3>Fuerza</h3>';
  for(const r of ROUTINES){
    const isM = r.id==="M";
    h+='<div class="card tap" onclick="startStrength(\''+r.id+'\')">'
      +'<div class="row between"><b>'+esc(r.name)+'</b><span class="pill '+(isM?"orange":"blue")+'">'+(isM?"diario":"fuerza")+'</span></div>'
      +'<div class="sub">'+r.exercises.map(e=>e.name.replace(" ⭐","")).join(" · ")+'</div></div>';
  }
  h+='<h3>Cardio</h3>';
  for(const c of CARDIO_TYPES){
    h+='<div class="card tap" onclick="openCardio(\''+c.id+'\')">'
      +'<div class="row between"><b>'+esc(c.name)+'</b><span class="pill orange">cardio</span></div>'
      +(c.target?'<div class="sub">'+esc(c.target)+'</div>':"")+'</div>';
  }
  return h;
}
function startStrength(rid){
  const r=ROUTINES.find(x=>x.id===rid);
  S.active={ id:uid(), date:todayISO(), type:"fuerza", routineId:rid, name:r.name,
    startTs:Date.now(), note:"",
    exercises:r.exercises.map(e=>({exId:e.id, name:e.name, mode:e.mode, sets:[]})) };
  saveState(); TAB="entrenar"; render();
}
function viewActiveSession(){
  const a=S.active;
  const r=ROUTINES.find(x=>x.id===a.routineId);
  const mins=Math.round((Date.now()-a.startTs)/60000);
  let h='<div class="sessionhead"><h2 style="margin:0">'+esc(a.name)+'</h2>'
    +'<span class="pill">'+mins+' min</span></div>';
  if(r && r.note) h+='<div class="banner">'+esc(r.note)+'</div>';
  r.exercises.forEach((exDef,i)=>{
    const ex=a.exercises[i];
    const last=lastPerf(exDef.id, a.id);
    const hint=progressionHint(exDef,last);
    const done=ex.sets.length>=exDef.sets;
    h+='<div class="card '+(done?"exdone":"")+'">';
    h+='<div class="row between"><b>'+esc(exDef.name)+'</b>'
      +'<span class="pill">'+targetLabel(exDef)+'</span></div>';
    if(exDef.tip) h+='<div class="safety">'+esc(exDef.tip)+'</div>';
    if(last) h+='<div class="prev">La vez pasada ('+fmtDate(last.date)+'): '
      + last.sets.map(s=>setLabel(exDef.mode,s)).join(" · ")+'</div>';
    if(hint) h+='<div class="hint up">📈 '+esc(hint)+'</div>';
    /* series ya registradas */
    for(let si=0; si<ex.sets.length; si++){
      h+='<div class="setrow"><span class="n">'+(si+1)+'</span>'
        +'<span style="flex:1">'+setLabel(exDef.mode,ex.sets[si])+'</span>'
        +'<button class="small ghost" onclick="delSet('+i+','+si+')">✕</button></div>';
    }
    /* fila de entrada */
    h+=inputRow(exDef,i,ex);
    h+='</div>';
  });
  h+='<label class="f">Notas de la sesión (craving, FC, molestias, energía…)</label>'
    +'<textarea id="sessNote" oninput="S.active.note=this.value">'+esc(a.note||"")+'</textarea>';
  h+='<div class="row" style="margin:16px 0">'
    +'<button class="primary" style="flex:2" onclick="finishSession()">✅ Terminar y guardar</button>'
    +'<button class="danger" style="flex:1" onclick="discardSession()">Descartar</button></div>';
  return h;
}
function targetLabel(e){
  if(e.mode==="hold") return e.sets+" × "+e.secs+" s"+(e.perSide?" c/lado":"");
  const r=e.reps? (e.reps[0]===e.reps[1]? e.reps[0] : e.reps[0]+"–"+e.reps[1]) : "";
  if(e.mode==="carry") return e.sets+" × "+r+" pasos c/lado";
  return e.sets+" × "+r+(e.perSide?" c/lado":"")+(e.startW?(" · "+e.startW+" lb"):"");
}
function inputRow(exDef,i,ex){
  const prevSet = ex.sets.length? ex.sets[ex.sets.length-1] : null;
  const last = lastPerf(exDef.id, S.active.id);
  const suggW = prevSet? prevSet.w : (last&&last.sets[0].w!=null? last.sets[0].w : exDef.startW||"");
  const suggR = prevSet? prevSet.r : (exDef.reps? exDef.reps[1] : "");
  const suggS = prevSet? prevSet.s : exDef.secs||30;
  const suggB = prevSet? (prevSet.band||"") : (last&&last.sets[0].band? last.sets[0].band : "");
  let fields="";
  if(exDef.mode==="w" || exDef.mode==="carry"){
    fields='<input type="number" inputmode="decimal" id="w'+i+'" placeholder="lb" value="'+suggW+'">'
      +'<span class="x">×</span>'
      +'<input type="number" inputmode="numeric" id="r'+i+'" placeholder="'+(exDef.mode==="carry"?"pasos":"reps")+'" value="'+suggR+'">';
  }else if(exDef.mode==="bw"){
    fields='<input type="number" inputmode="numeric" id="r'+i+'" placeholder="reps" value="'+suggR+'">'
      +'<span class="x">+</span>'
      +'<input type="number" inputmode="decimal" id="w'+i+'" placeholder="lastre" value="">';
  }else if(exDef.mode==="band"){
    fields='<input type="text" id="b'+i+'" placeholder="banda (color/tensión)" style="width:150px" value="'+esc(suggB)+'">'
      +'<span class="x">×</span>'
      +'<input type="number" inputmode="numeric" id="r'+i+'" placeholder="reps" value="'+suggR+'">';
  }else if(exDef.mode==="hold"){
    fields='<input type="number" inputmode="numeric" id="s'+i+'" placeholder="seg" value="'+suggS+'">'
      +'<span class="x">s</span>'
      +'<input type="text" id="b'+i+'" placeholder="banda (opc.)" style="width:130px" value="'+esc(suggB)+'">';
  }
  return '<div class="setrow"><span class="n">'+(ex.sets.length+1)+'</span>'+fields
    +'<button class="primary small" onclick="logSet('+i+')">＋ Serie</button></div>';
}
function num(id){ const el=document.getElementById(id); if(!el) return null; const v=parseFloat(el.value); return isNaN(v)?null:v; }
function txt(id){ const el=document.getElementById(id); return el? el.value.trim():""; }
function logSet(i){
  const a=S.active; const exDef=ROUTINES.find(r=>r.id===a.routineId).exercises[i];
  const st={};
  if(exDef.mode==="hold"){ st.s=num("s"+i); const b=txt("b"+i); if(b) st.band=b; if(!st.s) return; }
  else if(exDef.mode==="band"){ st.band=txt("b"+i)||"banda"; st.r=num("r"+i); if(!st.r) return; }
  else { st.w=num("w"+i); st.r=num("r"+i); if(!st.r) return; if(exDef.mode==="w"&&st.w==null) return; }
  a.exercises[i].sets.push(st);
  saveState();
  Timer.start();
  render();
}
function delSet(i,si){ S.active.exercises[i].sets.splice(si,1); saveState(); render(); }
function finishSession(){
  const a=S.active;
  a.exercises=a.exercises.filter(e=>e.sets.length);
  if(!a.exercises.length){ discardSession(); return; }
  a.durMin=Math.round((Date.now()-a.startTs)/60000);
  S.sessions.push(a); S.active=null;
  const t=todayISO(); S.checklist[t]=S.checklist[t]||{};
  S.checklist[t].sesion=true;
  if(a.routineId==="M") S.checklist[t].mcgill=true;
  saveState(); Timer.stop(); TAB="hoy"; render();
}
function discardSession(){
  if(!confirm("¿Descartar la sesión sin guardar?")) return;
  S.active=null; saveState(); Timer.stop(); render();
}

/* ---------- Cardio ---------- */
let cardioKind=null;
function openCardio(kind){
  cardioKind=kind;
  const c=CARDIO_TYPES.find(x=>x.id===kind);
  let h='<h2>'+esc(c.name)+'</h2>';
  if(c.target) h+='<div class="banner">🎯 '+esc(c.target)+'</div>';
  if(kind==="zona2") h+='<div class="safety">Puedes hablar con esfuerzo = en zona. Si puedes cantar, sube inclinación; si no puedes hablar, baja. NO es Zona 2 si la FC no está en 115–125.</div>';
  h+='<div class="card"><div class="grid2">';
  for(const f of c.fields){
    h+='<div><label class="f">'+CARDIO_FIELD_LABELS[f]+'</label>'
      +'<input type="number" inputmode="decimal" id="cf_'+f+'"></div>';
  }
  h+='</div><label class="f">Fecha</label><input type="date" id="cf_date" value="'+todayISO()+'">'
    +'<label class="f">Notas</label><textarea id="cf_note" placeholder="'+(kind==="golf"?"¿Ultra Zero 0.0? ¿Cuántas cervezas reales?":"")+'"></textarea></div>';
  h+='<div class="row" style="margin:16px 0">'
    +'<button class="primary" style="flex:2" onclick="saveCardio()">✅ Guardar sesión</button>'
    +'<button style="flex:1" onclick="TAB=\'entrenar\';render()">Cancelar</button></div>';
  document.getElementById("view").innerHTML=h;
  window.scrollTo(0,0);
}
function saveCardio(){
  const c=CARDIO_TYPES.find(x=>x.id===cardioKind);
  const data={kind:cardioKind, note:txt("cf_note")};
  let any=false;
  for(const f of c.fields){ const v=num("cf_"+f); if(v!=null){ data[f]=v; any=true; } }
  if(!any){ alert("Registra al menos un dato (duración, FC…)"); return; }
  const date=txt("cf_date")||todayISO();
  S.sessions.push({id:uid(), date, type:"cardio", name:c.name, cardio:data});
  if(date===todayISO()){ S.checklist[date]=S.checklist[date]||{}; S.checklist[date].sesion=true; }
  if(cardioKind==="zona2" && data.hrAvg && (data.hrAvg<115||data.hrAvg>125)){
    alert("FC promedio "+data.hrAvg+" está fuera de la ventana 115–125. Guardada igual — ajusta velocidad/inclinación la próxima.");
  }
  saveState(); TAB="hoy"; render();
}
</script>
<script>
/* ---------- VISTA: HISTORIAL ---------- */
function viewHistorial(){
  if(!S.sessions.length) return '<h2>Historial</h2><div class="card">Aún no hay sesiones. Arranca en la pestaña Entrenar. 💪</div>';
  const sorted=[...S.sessions].sort((a,b)=> a.date===b.date? 0 : (a.date<b.date?1:-1));
  let h='<h2>Historial</h2>';
  let curDate="";
  for(const s of sorted){
    if(s.date!==curDate){ curDate=s.date; h+='<h3>'+fmtDate(s.date)+'</h3>'; }
    h+='<div class="card"><div class="row between"><b>'+esc(s.name)+'</b>'
      +'<span class="pill '+(s.type==="fuerza"?"blue":"orange")+'">'+(s.type==="fuerza"?"fuerza":"cardio")+'</span></div>'
      +'<div class="sub">'+sessionSummary(s)+(s.durMin? " · "+s.durMin+" min":"")+'</div>';
    if(s.type==="fuerza"){
      h+='<details><summary style="font-size:14px;color:var(--accent)">Ver series</summary>';
      for(const ex of s.exercises){
        h+='<div style="margin:8px 0"><b style="font-size:14.5px">'+esc(ex.name)+'</b>';
        const best=ex.mode==="w"? Math.max(...ex.sets.map(x=>est1RM(x.w,x.r))) : 0;
        if(best) h+=' <span class="tag1rm">1RM est. '+best+' lb</span>';
        h+='<div class="histset">'+ex.sets.map(x=>setLabel(ex.mode,x)).join(" · ")+'</div></div>';
      }
      h+='</details>';
    }
    if(s.note) h+='<div class="safety">📝 '+esc(s.note)+'</div>';
    if(s.cardio && s.cardio.note) h+='<div class="safety">📝 '+esc(s.cardio.note)+'</div>';
    h+='<div class="row" style="margin-top:8px"><button class="small danger" onclick="delSession(\''+s.id+'\')">Borrar</button></div>';
    h+='</div>';
  }
  return h;
}
function delSession(id){
  if(!confirm("¿Borrar esta sesión del log?")) return;
  S.sessions=S.sessions.filter(s=>s.id!==id);
  saveState(); render();
}
</script>
<script>
/* ---------- VISTA: PROGRESO ---------- */
let progExId=null;
function trackedExercises(){
  const seen=new Map();
  for(const s of S.sessions){
    if(s.type!=="fuerza") continue;
    for(const ex of s.exercises){
      if((ex.mode==="w"||ex.mode==="bw") && ex.sets.length) seen.set(ex.exId, ex.name);
    }
  }
  return [...seen.entries()];
}
function viewProgreso(){
  const exs=trackedExercises();
  let h='<h2>Progreso</h2>';
  if(!S.sessions.length) return h+'<div class="card">Registra tu primera sesión y aquí aparecen las gráficas.</div>';
  /* Fuerza */
  h+='<div class="chartbox"><h3>Fuerza por ejercicio</h3>'
    +'<div class="sub">1RM estimado (Epley) — la métrica válida de progresión, no el volumen total</div>';
  if(exs.length){
    if(!progExId || !exs.find(e=>e[0]===progExId)) progExId=exs[0][0];
    h+='<select id="progSel" onchange="progExId=this.value;render()" style="margin-bottom:8px">';
    for(const [id,name] of exs) h+='<option value="'+id+'" '+(id===progExId?"selected":"")+'>'+esc(name)+'</option>';
    h+='</select><div id="chart1rm"></div>';
  } else h+='<div class="sub">Aún sin series de fuerza registradas.</div>';
  h+='</div>';
  /* Zona 2 */
  h+='<div class="chartbox"><h3>Zona 2 — FC promedio</h3>'
    +'<div class="sub">Ventana objetivo 115–125 bpm (banda sombreada)</div><div id="chartz2"></div></div>';
  /* Semanas */
  h+='<div class="chartbox"><h3>Sesiones por semana</h3>'
    +'<div class="sub">Meta: 3 fuerza + 2 cardio estructurado (la métrica que reemplaza a los exercise minutes)</div><div id="chartwk"></div>'
    +'<div class="legend"><span><span class="sw" style="background:var(--s1)"></span>Fuerza</span>'
    +'<span><span class="sw" style="background:var(--s2)"></span>Zona 2 / fútbol / rampa</span></div></div>';
  return h;
}

/* ---- helpers de SVG ---- */
function svgOpen(w,hh){ return '<svg viewBox="0 0 '+w+' '+hh+'" width="100%" style="display:block">'; }
function chartFrame(w,h,pad){
  let s="";
  for(let i=0;i<=3;i++){
    const y=pad.t+(h-pad.t-pad.b)*i/3;
    s+='<line x1="'+pad.l+'" y1="'+y+'" x2="'+(w-pad.r)+'" y2="'+y+'" stroke="var(--grid)" stroke-width="1"/>';
  }
  s+='<line x1="'+pad.l+'" y1="'+(h-pad.b)+'" x2="'+(w-pad.r)+'" y2="'+(h-pad.b)+'" stroke="var(--axis)" stroke-width="1"/>';
  return s;
}
function niceMax(v){ if(v<=10) return 10; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=Math.ceil(v/(p/2))*(p/2); return n; }
function ptTip(el){ /* tooltip por punto */
  const tip=document.getElementById("tooltip");
  el.addEventListener("pointerenter",ev=>{
    tip.textContent=el.dataset.tip;
    tip.style.display="block";
    const r=el.getBoundingClientRect();
    tip.style.left=(r.left+r.width/2+window.scrollX)+"px";
    tip.style.top=(r.top+window.scrollY)+"px";
  });
  el.addEventListener("pointerleave",()=>{ tip.style.display="none"; });
}
function bindTips(rootId){
  const root=document.getElementById(rootId); if(!root) return;
  root.querySelectorAll("[data-tip]").forEach(ptTip);
}

function drawCharts(){
  draw1RM(); drawZ2(); drawWeeks();
}
function draw1RM(){
  const box=document.getElementById("chart1rm"); if(!box) return;
  const pts=[];
  for(const s of S.sessions){
    if(s.type!=="fuerza") continue;
    const ex=(s.exercises||[]).find(e=>e.exId===progExId);
    if(!ex||!ex.sets.length) continue;
    let val=0;
    if(ex.mode==="w") val=Math.max(...ex.sets.map(x=>est1RM(x.w,x.r)));
    else val=Math.max(...ex.sets.map(x=>x.r||0)); /* bw: mejores reps */
    if(val) pts.push({date:s.date, v:val, mode:ex.mode});
  }
  if(!pts.length){ box.innerHTML='<div class="sub">Sin datos aún para este ejercicio.</div>'; return; }
  pts.sort((a,b)=>a.date<b.date?-1:1);
  const isBW=pts[0].mode==="bw";
  const W=760,H=240,pad={l:44,r:16,t:14,b:30};
  const maxV=niceMax(Math.max(...pts.map(p=>p.v))*1.1);
  const minV=0;
  const X=i=> pts.length===1? (pad.l+(W-pad.l-pad.r)/2) : pad.l+(W-pad.l-pad.r)*i/(pts.length-1);
  const Y=v=> (H-pad.b)-(H-pad.t-pad.b)*(v-minV)/(maxV-minV);
  let s=svgOpen(W,H)+chartFrame(W,H,pad);
  for(let i=0;i<=3;i++){
    const v=Math.round(maxV*(3-i)/3);
    s+='<text x="'+(pad.l-8)+'" y="'+(pad.t+(H-pad.t-pad.b)*i/3+4)+'" text-anchor="end" font-size="11" fill="var(--muted)" style="font-variant-numeric:tabular-nums">'+v+'</text>';
  }
  let path="";
  pts.forEach((p,i)=>{ path+=(i?"L":"M")+X(i)+","+Y(p.v); });
  s+='<path d="'+path+'" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>';
  pts.forEach((p,i)=>{
    s+='<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="5" fill="var(--s1)" stroke="var(--surface-1)" stroke-width="2" data-tip="'+fmtDate(p.date)+': '+p.v+(isBW?" reps":" lb")+'"/>';
  });
  const lastP=pts[pts.length-1];
  s+='<text x="'+(X(pts.length-1))+'" y="'+(Y(lastP.v)-10)+'" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">'+lastP.v+(isBW?" reps":" lb")+'</text>';
  s+='<text x="'+pad.l+'" y="'+(H-8)+'" font-size="11" fill="var(--muted)">'+fmtDate(pts[0].date)+'</text>';
  if(pts.length>1) s+='<text x="'+(W-pad.r)+'" y="'+(H-8)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+fmtDate(lastP.date)+'</text>';
  s+='</svg>';
  box.innerHTML=s; bindTips("chart1rm");
}
function drawZ2(){
  const box=document.getElementById("chartz2"); if(!box) return;
  const pts=S.sessions.filter(s=>s.type==="cardio"&&s.cardio.kind==="zona2"&&s.cardio.hrAvg)
    .map(s=>({date:s.date, v:s.cardio.hrAvg, min:s.cardio.min||0}))
    .sort((a,b)=>a.date<b.date?-1:1);
  if(!pts.length){ box.innerHTML='<div class="sub">Registra tu primera Zona 2 en el MyRun (la hipótesis #7 sigue esperando).</div>'; return; }
  const W=760,H=220,pad={l:44,r:16,t:14,b:30};
  const maxV=140, minV=90;
  const X=i=> pts.length===1? (pad.l+(W-pad.l-pad.r)/2) : pad.l+(W-pad.l-pad.r)*i/(pts.length-1);
  const Y=v=> (H-pad.b)-(H-pad.t-pad.b)*(Math.min(Math.max(v,minV),maxV)-minV)/(maxV-minV);
  let s=svgOpen(W,H);
  /* banda objetivo 115–125 */
  s+='<rect x="'+pad.l+'" y="'+Y(125)+'" width="'+(W-pad.l-pad.r)+'" height="'+(Y(115)-Y(125))+'" fill="var(--s3)" opacity="0.15"/>';
  s+=chartFrame(W,H,pad);
  [90,115,125,140].forEach(v=>{
    s+='<text x="'+(pad.l-8)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)" style="font-variant-numeric:tabular-nums">'+v+'</text>';
  });
  let path="";
  pts.forEach((p,i)=>{ path+=(i?"L":"M")+X(i)+","+Y(p.v); });
  s+='<path d="'+path+'" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round"/>';
  pts.forEach((p,i)=>{
    const inZone=p.v>=115&&p.v<=125;
    s+='<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="5" fill="var(--s2)" stroke="var(--surface-1)" stroke-width="2" data-tip="'+fmtDate(p.date)+': '+p.v+' bpm · '+p.min+' min'+(inZone?" ✓":" (fuera)")+'"/>';
  });
  s+='<text x="'+pad.l+'" y="'+(H-8)+'" font-size="11" fill="var(--muted)">'+fmtDate(pts[0].date)+'</text>';
  if(pts.length>1) s+='<text x="'+(W-pad.r)+'" y="'+(H-8)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+fmtDate(pts[pts.length-1].date)+'</text>';
  s+='</svg>';
  box.innerHTML=s; bindTips("chartz2");
}
function isoWeek(dateISO){
  const [y,m,d]=dateISO.split("-").map(Number);
  const dt=new Date(Date.UTC(y,m-1,d));
  const day=(dt.getUTCDay()+6)%7;
  dt.setUTCDate(dt.getUTCDate()-day+3);
  const firstThu=new Date(Date.UTC(dt.getUTCFullYear(),0,4));
  const fday=(firstThu.getUTCDay()+6)%7;
  firstThu.setUTCDate(firstThu.getUTCDate()-fday+3);
  const wk=1+Math.round((dt-firstThu)/(7*24*3600*1000));
  return dt.getUTCFullYear()+"-S"+String(wk).padStart(2,"0");
}
function drawWeeks(){
  const box=document.getElementById("chartwk"); if(!box) return;
  const weeks={};
  for(const s of S.sessions){
    const wk=isoWeek(s.date);
    weeks[wk]=weeks[wk]||{f:0,c:0};
    if(s.type==="fuerza"&&s.routineId!=="M") weeks[wk].f++;
    if(s.type==="cardio"&&["zona2","futbol","rampa"].includes(s.cardio.kind)) weeks[wk].c++;
  }
  const keys=Object.keys(weeks).sort().slice(-8);
  if(!keys.length){ box.innerHTML='<div class="sub">Sin sesiones aún.</div>'; return; }
  const W=760,H=200,pad={l:34,r:16,t:14,b:30};
  const maxV=Math.max(5,...keys.map(k=>Math.max(weeks[k].f,weeks[k].c)));
  const bw=Math.min(28,(W-pad.l-pad.r)/keys.length/3);
  const Y=v=>(H-pad.b)-(H-pad.t-pad.b)*v/maxV;
  let s=svgOpen(W,H)+chartFrame(W,H,pad);
  for(let i=0;i<=3;i++){
    const v=Math.round(maxV*(3-i)/3);
    s+='<text x="'+(pad.l-8)+'" y="'+(pad.t+(H-pad.t-pad.b)*i/3+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+v+'</text>';
  }
  keys.forEach((k,i)=>{
    const cx=pad.l+(W-pad.l-pad.r)*(i+0.5)/keys.length;
    const d=weeks[k];
    if(d.f) s+='<rect x="'+(cx-bw-1)+'" y="'+Y(d.f)+'" width="'+bw+'" height="'+((H-pad.b)-Y(d.f))+'" rx="4" fill="var(--s1)" data-tip="'+k+': '+d.f+' fuerza"/>';
    if(d.c) s+='<rect x="'+(cx+1)+'" y="'+Y(d.c)+'" width="'+bw+'" height="'+((H-pad.b)-Y(d.c))+'" rx="4" fill="var(--s2)" data-tip="'+k+': '+d.c+' cardio"/>';
    s+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" font-size="10.5" fill="var(--muted)">'+k.slice(5)+'</text>';
  });
  s+='</svg>';
  box.innerHTML=s; bindTips("chartwk");
}
</script>
<script>
/* ---------- VISTA: DATOS (export / import / ajustes / ayuda) ---------- */
function viewDatos(){
  let h='<h2>Datos</h2>';
  h+='<div class="card"><b>Exportar para análisis (chat de salud)</b>'
    +'<div class="sub">Genera un resumen de texto listo para pegar en el chat, o CSV para hoja de cálculo.</div>'
    +'<div class="row" style="margin-top:10px">'
    +'<button onclick="exportText()">📋 Copiar resumen</button>'
    +'<button onclick="exportCSV()">⬇️ CSV fuerza</button>'
    +'<button onclick="exportCardioCSV()">⬇️ CSV cardio</button></div>'
    +'<div class="sub" id="expMsg" style="margin-top:6px"></div></div>';
  h+='<div class="card"><b>Copia de seguridad</b>'
    +'<div class="sub">Respaldo completo en JSON. Impórtalo si cambias de archivo o de dispositivo.</div>'
    +'<div class="row" style="margin-top:10px">'
    +'<button onclick="backupJSON()">⬇️ Descargar respaldo</button>'
    +'<button onclick="document.getElementById(\'importFile\').click()">⬆️ Importar respaldo</button>'
    +'<input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importJSON(this)"></div></div>';
  h+='<div class="card"><b>Ajustes</b>'
    +'<label class="f">Descanso entre series (segundos)</label>'
    +'<input type="number" inputmode="numeric" value="'+(S.settings.restSec||90)+'" style="width:120px" onchange="S.settings.restSec=parseInt(this.value)||90;saveState()">'
    +'</div>';
  h+='<div class="card"><b>Cómo usarla en el iPad</b>'
    +'<div class="sub" style="margin-top:6px">1. Abre la URL de la app en <b>Safari del iPad</b>.<br>'
    +'2. Botón compartir (⬆️) → <b>"Añadir a pantalla de inicio"</b> — queda como app con su ícono, a pantalla completa.<br>'
    +'3. Tus datos se guardan en el iPad automáticamente y sobreviven a las actualizaciones de la app.<br>'
    +'4. Una vez por semana: <b>⬇️ Descargar respaldo</b> — y pega el 📋 resumen en el chat de salud para análisis.</div></div>';
  h+='<div class="sub" style="text-align:center;margin:20px 0">Modo Atleta v'+APP_VERSION+' · plan Fase 1 (ago 2026) · las rutinas se actualizan en el chat de salud</div>';
  return h;
}
function fmtSets(ex){ return ex.sets.map(x=>setLabel(ex.mode,x)).join(", "); }
function exportText(){
  let out="REGISTRO MODO ATLETA — export "+todayISO()+"\n\n";
  const sorted=[...S.sessions].sort((a,b)=>a.date<b.date?-1:1);
  let cur="";
  for(const s of sorted){
    if(s.date!==cur){ cur=s.date; out+="\n== "+s.date+" ==\n"; }
    if(s.type==="fuerza"){
      out+="["+s.name+(s.durMin?(" · "+s.durMin+" min"):"")+"]\n";
      for(const ex of s.exercises){
        out+="  - "+ex.name+": "+fmtSets(ex);
        if(ex.mode==="w"){ const b=Math.max(...ex.sets.map(x=>est1RM(x.w,x.r))); if(b) out+=" (1RM est. "+b+")"; }
        out+="\n";
      }
      if(s.note) out+="  Nota: "+s.note+"\n";
    }else{
      const c=s.cardio;
      out+="["+s.name+"] "+sessionSummary(s)+"\n";
      if(c.note) out+="  Nota: "+c.note+"\n";
    }
  }
  out+="\nChecklist (últimos 14 días):\n";
  const days=Object.keys(S.checklist).sort().slice(-14);
  for(const d of days){
    const c=S.checklist[d];
    const okKeys = CHECKLIST.filter(k=>c[k.id]).map(k=>k.t);
    out+="  "+d+": "+(okKeys.length? okKeys.join(" · ") : "—")+"\n";
  }
  copyOrDownload(out, "modo-atleta-resumen.txt", "Resumen copiado al portapapeles ✓");
}
function csvEsc(v){ v=String(v==null?"":v); return /[",\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; }
function exportCSV(){
  let rows=[["fecha","rutina","ejercicio","serie","peso_lb","reps","segundos","banda","1rm_est"]];
  for(const s of S.sessions){
    if(s.type!=="fuerza") continue;
    for(const ex of s.exercises){
      ex.sets.forEach((st,i)=>{
        rows.push([s.date,s.name,ex.name,i+1,st.w??"",st.r??"",st.s??"",st.band??"",
          (ex.mode==="w"&&st.w&&st.r)?est1RM(st.w,st.r):""]);
      });
    }
  }
  downloadFile(rows.map(r=>r.map(csvEsc).join(",")).join("\n"), "modo-atleta-fuerza.csv","text/csv");
}
function exportCardioCSV(){
  let rows=[["fecha","tipo","min","fc_prom","fc_max","velocidad_mph","inclinacion_pct","distancia_mi","kcal","nota"]];
  for(const s of S.sessions){
    if(s.type!=="cardio") continue;
    const c=s.cardio;
    rows.push([s.date,s.name,c.min??"",c.hrAvg??"",c.hrMax??"",c.speed??"",c.incline??"",c.dist??"",c.kcal??"",c.note??""]);
  }
  downloadFile(rows.map(r=>r.map(csvEsc).join(",")).join("\n"), "modo-atleta-cardio.csv","text/csv");
}
function backupJSON(){
  downloadFile(JSON.stringify({app:"modoAtleta",version:APP_VERSION,exported:new Date().toISOString(),data:S},null,1),
    "modo-atleta-respaldo.json","application/json");
}
function importJSON(input){
  const f=input.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const obj=JSON.parse(rd.result);
      const data=obj.data||obj;
      if(!Array.isArray(data.sessions)) throw new Error("formato");
      if(!confirm("Importar respaldo con "+data.sessions.length+" sesiones. ¿Reemplazar los datos actuales?")) return;
      S=data; S.settings=S.settings||{restSec:90}; S.checklist=S.checklist||{};
      saveState(); render();
      alert("Respaldo importado ✓");
    }catch(e){ alert("No pude leer ese archivo. ¿Es el respaldo JSON de Modo Atleta?"); }
  };
  rd.readAsText(f);
}
function downloadFile(content,name,type){
  try{
    const blob=new Blob([content],{type:type+";charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},400);
  }catch(e){ copyOrDownload(content,name,"Copiado al portapapeles ✓"); }
}
function copyOrDownload(text,name,okMsg){
  const done=()=>{ const m=document.getElementById("expMsg"); if(m){ m.textContent=okMsg; setTimeout(()=>m.textContent="",4000);} else alert(okMsg); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ alert("No pude copiar — usa la descarga."); }
  ta.remove();
}

/* ---------- Init ---------- */
if(S.active) TAB="entrenar";
render();
</script>
