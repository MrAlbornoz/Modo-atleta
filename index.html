<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Modo Atleta">
<meta name="theme-color" content="#2a78d6">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>Modo Atleta — Federico</title>
<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --page:#f9f9f7;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-text:#006300;
  --accent:#2a78d6;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --surface-1:#1a1a19; --page:#0d0d0d;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --good-text:#0ca30c;
    --accent:#3987e5;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background:var(--page); color:var(--ink);
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
  font-size:17px; line-height:1.45;
}
header.app{
  position:sticky; top:0; z-index:20;
  background:var(--page);
  padding: calc(10px + env(safe-area-inset-top)) 20px 8px;
  display:flex; align-items:baseline; justify-content:space-between;
  border-bottom:1px solid var(--border);
}
header.app h1{font-size:20px; margin:0; letter-spacing:-0.02em;}
header.app .date{color:var(--muted); font-size:14px;}
main{max-width:840px; margin:0 auto; padding:16px 16px 32px;}
h2{font-size:22px; margin:18px 0 10px; letter-spacing:-0.02em;}
h3{font-size:17px; margin:16px 0 8px;}
.card{
  background:var(--surface-1); border:1px solid var(--border);
  border-radius:16px; padding:16px; margin:10px 0;
}
.card.tap{cursor:pointer;}
.card .sub{color:var(--ink-2); font-size:14px; margin-top:2px;}
.row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.row.between{justify-content:space-between;}
.pill{
  display:inline-block; font-size:12.5px; padding:3px 10px; border-radius:999px;
  border:1px solid var(--border); color:var(--ink-2); background:transparent;
}
.pill.blue{color:#fff; background:var(--s1); border-color:var(--s1);}
.pill.orange{color:#fff; background:var(--s2); border-color:var(--s2);}
.pill.green{color:#fff; background:var(--s3); border-color:var(--s3);}
.pill.warn{color:var(--ink); background:transparent; border-color:var(--warn);}
button{
  font-family:inherit; font-size:16px; border:none; border-radius:12px;
  padding:12px 16px; cursor:pointer; color:var(--ink);
  background:var(--surface-1); border:1px solid var(--border);
}
button.primary{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}
button.ghost{background:transparent;}
button.small{font-size:14px; padding:8px 12px; border-radius:10px;}
button.danger{color:var(--crit); border-color:var(--crit); background:transparent;}
button:active{opacity:.75;}
input,select,textarea{
  font-family:inherit; font-size:17px; color:var(--ink);
  background:var(--surface-1); border:1px solid var(--axis); border-radius:10px;
  padding:10px 12px; width:100%;
}
input[type=number]{text-align:center;}
label.f{display:block; font-size:13px; color:var(--ink-2); margin:10px 0 4px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
nav.tabs{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  display:flex; justify-content:space-around;
  background:var(--surface-1); border-top:1px solid var(--border);
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
}
nav.tabs button{
  flex:1; background:none; border:none; color:var(--muted);
  font-size:12px; padding:6px 2px; display:flex; flex-direction:column; align-items:center; gap:2px;
}
nav.tabs button .ico{font-size:22px; line-height:1;}
nav.tabs button.active{color:var(--accent); font-weight:600;}
.setrow{
  display:flex; align-items:center; gap:8px; padding:8px 0;
  border-bottom:1px solid var(--grid); font-variant-numeric:tabular-nums;
}
.setrow:last-child{border-bottom:none;}
.setrow .n{width:26px; color:var(--muted); font-size:14px;}
.setrow input{width:74px; padding:8px 6px;}
.setrow .x{color:var(--muted);}
.setrow button{padding:8px 12px;}
.prev{
  font-size:13.5px; color:var(--ink-2); background:var(--page);
  border-radius:8px; padding:6px 10px; margin:6px 0;
}
.hint{
  font-size:13.5px; border-left:3px solid var(--good); padding:6px 10px; margin:8px 0;
  color:var(--ink-2); background:var(--page); border-radius:0 8px 8px 0;
}
.hint.up{border-left-color:var(--s1);}
.safety{font-size:13px; color:var(--muted); margin-top:6px;}
.done{color:var(--good-text); font-weight:600;}
.timerbar{
  position:fixed; left:0; right:0; bottom:calc(64px + env(safe-area-inset-bottom)); z-index:40;
  background:var(--warn); color:#0b0b0b; display:none;
  align-items:center; justify-content:space-between; padding:14px 20px;
  font-variant-numeric:tabular-nums; font-size:22px; font-weight:700;
}
.timerbar.final{background:var(--crit); color:#fff;}
.timerbar button{background:rgba(0,0,0,.15); color:inherit; border:none; font-weight:600;}
.delta{font-size:13px; font-weight:700; margin-left:6px;}
.delta.up{color:var(--good-text);}
.delta.dn{color:var(--crit);}
.setrow.pending input{border-color:var(--axis);}
.confirmbtn{min-width:52px;}
.kpi{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin:12px 0;}
.kpi .tile{background:var(--surface-1); border:1px solid var(--border); border-radius:14px; padding:12px 14px;}
.kpi .tile .v{font-size:26px; font-weight:700; letter-spacing:-0.02em;}
.kpi .tile .l{font-size:12.5px; color:var(--muted); margin-top:2px;}
.chartbox{background:var(--surface-1); border:1px solid var(--border); border-radius:16px; padding:14px; margin:12px 0;}
.chartbox h3{margin:0 0 4px;}
.chartbox .sub{font-size:13px; color:var(--muted); margin-bottom:8px;}
svg text{font-family:inherit;}
.legend{display:flex; gap:16px; font-size:13px; color:var(--ink-2); margin-top:6px; flex-wrap:wrap;}
.legend .sw{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px;}
.checkitem{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--grid); cursor:pointer;}
.checkitem:last-child{border-bottom:none;}
.checkitem .box{
  width:26px; height:26px; border-radius:8px; border:2px solid var(--axis);
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; flex:none;
}
.checkitem.on .box{background:var(--good); border-color:var(--good);}
.checkitem .t{flex:1;}
.checkitem .d{font-size:13px; color:var(--muted);}
.banner{
  border:1px solid var(--warn); border-radius:12px; padding:10px 14px; margin:10px 0;
  font-size:14px; color:var(--ink-2);
}
.banner.info{border-color:var(--s1);}
.sessionhead{display:flex; justify-content:space-between; align-items:center; gap:10px; margin:8px 0;}
.histset{font-size:14.5px; color:var(--ink-2); font-variant-numeric:tabular-nums;}
details{margin:4px 0;}
summary{cursor:pointer;}
textarea{min-height:70px;}
.exdone{opacity:.55;}
.tag1rm{font-size:12.5px; color:var(--muted);}
a{color:var(--accent);}
.tooltip{
  position:absolute; pointer-events:none; background:var(--ink); color:var(--page);
  font-size:12.5px; padding:4px 8px; border-radius:6px; white-space:nowrap; z-index:50;
  transform:translate(-50%,-130%); display:none; font-variant-numeric:tabular-nums;
}
/* --- guion de intervalos --- */
.phasebig{
  background:var(--surface-1); border:2px solid var(--accent); border-radius:18px;
  padding:18px; margin:10px 0; text-align:center;
}
.phasebig.surge{border-color:var(--s2);}
.phasebig .ph-t{font-size:19px; font-weight:700; letter-spacing:-0.02em;}
.phasebig .ph-c{font-size:54px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-0.03em; line-height:1.05; margin:4px 0;}
.phasebig .ph-set{display:flex; justify-content:center; gap:18px; margin-top:6px; flex-wrap:wrap;}
.phasebig .ph-set div{font-size:13px; color:var(--muted);}
.phasebig .ph-set div b{display:block; font-size:24px; color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums;}
.phaselist{font-size:14px;}
.phaselist .p{display:flex; justify-content:space-between; gap:8px; padding:7px 0; border-bottom:1px solid var(--grid);}
.phaselist .p:last-child{border-bottom:none;}
.phaselist .p.now{font-weight:700; color:var(--accent);}
.phaselist .p.past{opacity:.45; text-decoration:line-through;}
.phaselist .p .m{color:var(--muted); font-variant-numeric:tabular-nums; font-weight:400;}
.progbar{height:6px; background:var(--grid); border-radius:999px; overflow:hidden; margin:8px 0 2px;}
.progbar i{display:block; height:100%; background:var(--accent);}
.exrow{padding:10px 0; border-bottom:1px solid var(--grid);}
.exrow:last-child{border-bottom:none;}
.exrow .nm{font-size:15px; font-weight:600;}
.exrow .pr{font-size:13px; color:var(--muted);}
.exrow .in{display:flex; gap:6px; align-items:center; margin-top:6px;}
.exrow .in input{width:70px; padding:8px 4px;}
.exrow .in span{font-size:13px; color:var(--muted);}
.pairtag{font-size:11.5px; font-weight:700; color:var(--s1); letter-spacing:.04em;}
.seg{display:flex; gap:6px; flex-wrap:wrap;}
.seg button{flex:1; min-width:64px; font-size:14px; padding:10px 6px;}
.seg button.on{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}
.seg.rpe{gap:5px;}
.seg.rpe button{min-width:0; font-weight:700; font-size:16px; padding:11px 0;}
.seg.rpe button.on.r1{background:var(--s1); border-color:var(--s1); color:#fff;}
.seg.rpe button.on.r2, .seg.rpe button.on.r3{background:var(--good); border-color:var(--good); color:#fff;}
.seg.rpe button.on.r4{background:var(--warn); border-color:var(--warn); color:#0b0b0b;}
.seg.rpe button.on.r5{background:var(--crit); border-color:var(--crit); color:#fff;}
.rpelab{font-size:12px; color:var(--muted); display:flex; justify-content:space-between; margin-top:3px;}
.seg.tri button.on.g{background:var(--good); border-color:var(--good);}
.seg.tri button.on.y{background:var(--warn); border-color:var(--warn); color:#0b0b0b;}
.seg.tri button.on.r{background:var(--crit); border-color:var(--crit); color:#fff;}
</style>
</head>
<body data-palette="#2a78d6,#eb6834,#1baf7a">
<header class="app">
  <h1>Modo Atleta</h1>
  <div class="date" id="hdrDate"></div>
</header>
<main id="view"></main>
<div class="timerbar" id="timerbar">
  <span id="timerLabel">Descanso</span>
  <span id="timerCount">1:30</span>
  <button class="small" onclick="Timer.stop()">Listo</button>
</div>
<div class="tooltip" id="tooltip"></div>
<nav class="tabs" id="tabs">
  <button data-tab="cierre"><span class="ico">📝</span>Cierre</button>
  <button data-tab="entrenar"><span class="ico">🏋️</span>Entrenar</button>
  <button data-tab="historial"><span class="ico">📒</span>Historial</button>
  <button data-tab="progreso"><span class="ico">📈</span>Progreso</button>
  <button data-tab="datos"><span class="ico">⚙️</span>Datos</button>
</nav>
<script>
"use strict";
/* ============================================================
   MODO ATLETA — Federico Albornoz
   v2.0 — 1 septiembre 2026
   Cambios v2.0:
   · CIERRE DEL DÍA: un solo registro al final del día (reemplaza
     el registro actividad por actividad como flujo principal).
   · CARDIO TRABAJO: 45 min diarios 6am en ayunas, por intervalos,
     con guion en pantalla (bloques <2.5 mph trabajables + surges).
   · FUERZA: 3 sesiones (Mar/Jue/Sáb) pesadas y cortas, 4–6 reps,
     en supersets, con el bloque de disociación golf/tenis DENTRO.
   Reglas fijas: sin carga axial (L2–S1) · exhalar en el esfuerzo,
   nada de Valsalva (CAC 385.9) · nunca al fallo, 1–2 en reserva ·
   la FC manda sobre el número · bandas por tensión, no libras ·
   progresión por 1RM estimado, no volumen total.
   ============================================================ */

const APP_VERSION = "2.2";
const LS_KEY = "modoAtleta_v1";   /* NO renombrar: aquí vive el historial */

const DB_STEPS = [5,10,15,20,25,35,40,50,60];

/* ---------- CARDIO TRABAJO — guion de 45 min ----------
   Diseño: ~32 de los 45 min transcurren a ≤2.5 mph, con la
   inclinación haciendo el trabajo → iPad arriba, llamadas y
   lectura posibles. Los surges van por RAMPA (más carga que
   5 mph en plano, cero impacto). El burst de 5.0 mph plano
   queda como opción única en el surge 3, solo con espalda 🟢. */
const INTERVAL_PLAN = [
 {t:"Calentamiento", sec:300, spd:"2.5", inc:"2 → 6", hr:"95–110", work:true,
  note:"Sube 1% de inclinación cada minuto. iPad arriba desde ya."},
 {t:"Trabajo 1", sec:540, spd:"2.2", inc:"12", hr:"115–125", work:true,
  note:"Zona 2 trabajable. Llamadas, lectura, revisión. Si puedes cantar, sube 1% de inclinación."},
 {t:"SURGE 1 — rampa", sec:90, spd:"4.0", inc:"12", hr:"140–150", work:false,
  note:"iPad abajo, manos libres. Paso largo, sin agarrarte de las barras."},
 {t:"Recuperación", sec:90, spd:"2.0", inc:"4", hr:"<120", work:true,
  note:"Respira por la nariz. Si a los 90 s no bajaste de 120, el próximo surge va más corto."},
 {t:"Trabajo 2", sec:540, spd:"2.2", inc:"13", hr:"115–125", work:true,
  note:"Un punto más de inclinación que el bloque 1."},
 {t:"SURGE 2 — rampa", sec:90, spd:"4.0", inc:"13", hr:"145–155", work:false,
  note:"Mismo esfuerzo, un grado más empinado."},
 {t:"Recuperación", sec:90, spd:"2.0", inc:"4", hr:"<120", work:true},
 {t:"Trabajo 3", sec:540, spd:"2.4", inc:"12", hr:"115–125", work:true,
  note:"Bloque más rápido y algo menos empinado — cambia el patrón de paso."},
 {t:"SURGE 3 — libre", sec:90, spd:"4.2 ó 5.0", inc:"12 ó 0", hr:"150–155", work:false,
  note:"Aquí va el único burst de 5.0 mph, y SOLO si la espalda amaneció 🟢 y ya estás caliente. 40 s máximo, inclinación a 0 antes de acelerar. Cualquier señal en la lumbar → rampa a 4.2 y listo."},
 {t:"Enfriamiento", sec:240, spd:"2.0", inc:"2", hr:"<110", work:true,
  note:"No te bajes en caliente. Aquí es donde el RHR aprende a bajar."}
];
const INTERVAL_TOTAL = INTERVAL_PLAN.reduce((a,p)=>a+p.sec,0);

/* Escalera de progresión del cardio (4 semanas) */
const RUN_LADDER = [
  {f:"Fase 0 — ahora", d:"Pogos 3×10 en S1 y S3 · sóleo sentado en S2 · step-down con freno en S3. Cero carrera todavía: se construye el tendón y el amortiguador."},
  {f:"Fase 1 — trote-caminata", d:"30 s trote / 90 s caminata × 6, 2×/sem en el MyRun. Puerta de entrada: 8 semanas con la pierna izquierda callada."},
  {f:"Fase 2 — continuo suave", d:"10–15 min seguidos + 4 rectas de 60 m."},
  {f:"Fase 3 — tu velocidad", d:"Aceleraciones cortas con recuperación completa. Alta fuerza, bajísimo volumen: 10 × 40 m es MUCHA menos exposición para la columna que 40 min trotando."}
];
const RUN_GATES = [
  "🫀 Prueba de esfuerzo hecha. Es la puerta #1 — no la del back, la del corazón.",
  "🦵 Ocho semanas sin síntomas en la pierna izquierda: sin hormigueo, sin irradiación, sin debilidad.",
  "📉 Regla de retroceso: un síntoma durante la sesión o en las 24 h siguientes = bajas un escalón. No se aguanta."
];

const CARDIO_LADDER = [
  "Sem 1–2: bloques de trabajo al 10–12%. Meta: terminar los 45 min sin que la FC se salga de 125 en los bloques.",
  "Sem 3–4: 12–14%. Los surges suben a 4.2 mph.",
  "Sem 5+: 14–15%, o suma un 4º ciclo (sesión de 57 min). Lo que suba primero es la inclinación, nunca la velocidad de los bloques."
];

/* ---------- RUTINAS DE FUERZA ----------
   modes: w = peso+reps · bw = corporal · band = banda (tensión+reps)
          hold = isométrico (segundos) · carry = acarreo
   pair: A1/A2 y B1/B2 se hacen en superserie (alternando, 90 s entre pares).
   block: "fuerza" | "disoc" (bloque de disociación golf/tenis) */
const ROUTINES = [
{
  id:"S1", name:"S1 — Empuje pesado + Golf", day:"Martes", color:"blue",
  dur:"~42 min",
  note:"PESADO Y CORTO: 4–6 reps, 1–2 en reserva, NUNCA al fallo. Exhala en el esfuerzo — nada de aguantar la respiración (CAC 385.9). A1/A2 y B1/B2 son superseries: alternas y descansas 90 s entre pares.",
  exercises:[
    {id:"floorpress", name:"Floor Press — EZ Bar", mode:"w", sets:4, reps:[4,6], startW:170, pair:"A1", block:"fuerza",
     tip:"Tu lift más pesado. Techo del inventario ~180 lb: cuando salgan 4×6 limpias, añade pausa de 2 s en el piso antes de subir peso."},
    {id:"pullup", name:"Pull Up", mode:"bw", sets:4, reps:[4,6], pair:"A2", block:"fuerza",
     tip:"La columna cuelga, no carga. Si pasas de 6 limpias, agrega lastre (mochila o mancuerna entre los pies)."},
    {id:"incpress", name:"DB Incline Press", mode:"w", sets:3, reps:[5,7], startW:50, pair:"B1", block:"fuerza",
     tip:"Peso POR MANCUERNA. Salto 50→60 es +20%: primero llega a 3×7 con 50."},
    {id:"dbrow", name:"DB Row (1 brazo, apoyado)", mode:"w", sets:3, reps:[6,8], startW:60, perSide:true, pair:"B2", block:"fuerza",
     tip:"Techo del inventario (60). Cuando salgan 3×8 por lado, progresa con pausa de 1 s arriba."},
    {id:"pogo", name:"🏃 Pogos — rigidez de tobillo", mode:"bw", sets:3, reps:[10,10], block:"run",
     tip:"FASE 0 DEL RETORNO A CORRER. Saltitos mínimos, solo tobillo, rodilla casi recta, contacto corto y silencioso. Amplitud pequeña — no es saltar, es rebotar. Si suena fuerte al caer, bájale."},
    {id:"mbrot", name:"🏌️ Lanzamiento rotacional — pelota 20 lb", mode:"w", sets:3, reps:[5,5], startW:20, perSide:true, block:"disoc",
     tip:"DISOCIACIÓN: el giro arranca en la cadera, la columna solo transmite. Intención de máxima velocidad, contra pared, sin slams. Es el ejercicio que más transfiere a velocidad de swing."},
    {id:"pallof", name:"Pallof Press — HOLD", mode:"hold", sets:2, secs:30, perSide:true, block:"disoc",
     tip:"El freno de la rotación. Banda 70 lb en loop. Anti-rotación = seguro de la lumbar."},
    {id:"calf", name:"Elevación de talones ⭐", mode:"w", sets:3, reps:[12,15], startW:60, block:"fuerza",
     tip:"PRIORIDAD sarcopenia (pantorrilla 14\"). Va martes y sábado. Nunca saltarla."}
  ]
},
{
  id:"S2", name:"S2 — Tirón / bisagra + Tenis", day:"Jueves", color:"blue",
  dur:"~40 min",
  note:"Cadera pesada sin carga axial. El bloque de tenis es abajo→arriba (patrón de saque) y salud de manguito rotador — no lo saltes: el hombro es lo primero que se rompe volviendo al tenis.",
  exercises:[
    {id:"hipthrust", name:"DB Hip Thrust", mode:"w", sets:4, reps:[5,8], startW:60, pair:"A1", block:"fuerza",
     tip:"Dos mancuernas de 60 sobre la cadera (con toalla) = 120 lb sin comprimir la columna. AHORA CON INTENCIÓN EXPLOSIVA: sube rápido, baja controlado. La extensión de cadera veloz es el motor del sprint."},
    {id:"dip", name:"Chest Dip (paralelas)", mode:"bw", sets:4, reps:[5,8], pair:"A2", block:"fuerza",
     tip:"A ~226 lb de corporal es tu mejor carga de empuje. Cero carga axial."},
    {id:"bss", name:"Bulgarian Split Squat", mode:"w", sets:3, reps:[6,8], startW:40, perSide:true, pair:"B1", block:"fuerza",
     tip:"Peso por mano. Aquí la FC se dispara: autorregula por pulso, no por el número."},
    {id:"facepull", name:"Face Pull con banda", mode:"band", sets:3, reps:[15,15], pair:"B2", block:"fuerza",
     tip:"Anota color/tensión de banda + distancia al anclaje, nunca libras."},
    {id:"choplift", name:"🎾 Lift con banda (abajo → arriba)", mode:"band", sets:3, reps:[8,10], perSide:true, block:"disoc",
     tip:"DISOCIACIÓN DE SAQUE: banda anclada abajo, tiras en diagonal hasta arriba del hombro opuesto. Gira la cadera primero, hombros después. Termina alto SIN arquear la lumbar."},

<script>
/* ---------- Estado ---------- */
let MEM_FALLBACK = false;
let memStore = null;
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ MEM_FALLBACK = true; }
  return memStore || {sessions:[], checklist:{}, days:{}, lowReadiness:{}, settings:{restSec:90}, active:null};
}
function saveState(){
  S.settings = S.settings || {restSec:90};
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); MEM_FALLBACK=false; }
  catch(e){ MEM_FALLBACK = true; memStore = S; }
}
let S = loadState();
S.sessions = S.sessions || []; S.checklist = S.checklist || {}; S.days = S.days || {};
S.lowReadiness = S.lowReadiness || {};
S.settings = S.settings || {restSec:90};

/* Readiness baja (heredado de v1.3): 1 serie menos por ejercicio, mínimo 2.
   El McGill nunca se recorta. */
function isLow(iso){ return !!(S.lowReadiness && S.lowReadiness[iso||todayISO()]); }
function toggleLowReadiness(iso){
  const t=iso||todayISO();
  if(typeof syncFields==="function") syncFields();
  if(S.lowReadiness[t]) delete S.lowReadiness[t]; else S.lowReadiness[t]=true;
  /* el número de series se recalcula: borramos el valor guardado, no los pesos */
  const d=S.days&&S.days[t];
  if(d&&d.fuerza&&d.fuerza.ex) for(const k in d.fuerza.ex) delete d.fuerza.ex[k].sets;
  saveState(); render();
}
function tgtSetsFor(exDef, routineId, iso){
  if(routineId==="M") return exDef.sets;
  return isLow(iso)? Math.max(2, exDef.sets-1) : exDef.sets;
}
function tgtSets(exDef){
  const a=S.active;
  if(a && a.low && a.routineId!=="M") return Math.max(2, exDef.sets-1);
  return exDef.sets;
}

function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(iso){
  const [y,m,d]=iso.split("-").map(Number);
  const dt=new Date(y,m-1,d);
  return dt.toLocaleDateString("es-ES",{weekday:"short", day:"numeric", month:"short"});
}
function dowOf(iso){ const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d).getDay(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function est1RM(w,r){ if(!w||!r) return 0; return Math.round(w*(1+r/30)); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function mmss(sec){ const m=Math.floor(sec/60), s=Math.round(sec%60); return m+":"+String(s).padStart(2,"0"); }

function routineById(id){ return ROUTINES.find(r=>r.id===id)||null; }

/* Última vez que se registró un ejercicio */
function lastPerf(exId, excludeSessionId){
  for(let i=S.sessions.length-1;i>=0;i--){
    const s=S.sessions[i];
    if(s.type!=="fuerza" || s.id===excludeSessionId) continue;
    const ex=(s.exercises||[]).find(e=>e.exId===exId);
    if(ex && ex.sets && ex.sets.length) return {date:s.date, sets:ex.sets, rpe:(ex.rpe||null)};
  }
  return null;
}
function setLabel(mode,st){
  if(mode==="hold") return (st.s||0)+" s" + (st.band? " · "+st.band : "");
  if(mode==="band") return (st.band||"banda")+" × "+(st.r||0);
  if(mode==="carry") return (st.w||0)+" lb × "+(st.r||0)+" pasos";
  if(mode==="bw") return (st.w? "+"+st.w+" lb × " : "") + (st.r||0) + (st.w?"":" reps");
  return (st.w||0)+" lb × "+(st.r||0);
}
function nextDBStep(w){ for(const s of DB_STEPS){ if(s>w) return s; } return null; }
function prevDBStep(w){ let p=null; for(const s of DB_STEPS){ if(s<w) p=s; } return p; }

/* ---------- ESFUERZO PERCIBIDO (1–5) ----------
   Regla de Federico: 1 = subir en la siguiente sesión, sin esperar.
   5 = mantener o bajar. 2–4 = progresión normal. */
const RPE_HELP = "1 = sin esfuerzo · 5 = muchísimo esfuerzo";
function rpeRow(current, onclickTpl){
  let h='<div style="margin-top:10px"><div style="font-size:12.5px;color:var(--ink-2)">¿Cómo sentiste el esfuerzo?</div><div class="seg rpe" style="margin-top:5px">';
  for(let v=1;v<=5;v++)
    h+='<button class="'+(current===v?"on r"+v:"")+'" onclick="'+onclickTpl.replace("%V%",v)+'">'+v+'</button>';
  h+='</div><div class="rpelab"><span>1 · nada</span><span>5 · muchísimo</span></div></div>';
  return h;
}

function progressionHint(exDef, last){
  if(!last) return null;
  const topReps = exDef.reps ? exDef.reps[1] : null;
  if(exDef.mode==="w"){
    const sets=last.sets.filter(s=>s.r);
    if(sets.length>=exDef.sets && sets.every(s=>s.r>=topReps)){
      const w=Math.max(...sets.map(s=>s.w||0));
      const nxt=nextDBStep(w);
      if(exDef.id==="floorpress") return "Todas al tope ("+topReps+"). Sube +5 lb en discos o añade pausa de 2 s abajo.";
      if(nxt && nxt-w>10) return "Todas al tope con "+w+" lb. El salto a "+nxt+" es grande (+"+(nxt-w)+"): 1–2 series con "+nxt+" y completa con "+w+", o tempo 3-1-1.";
      if(nxt) return "Todas al tope con "+w+" lb → sube a "+nxt+" lb.";
      return "Techo del inventario ("+w+" lb): progresa con tempo, pausas o una serie más — no con más reps.";
    }
  }else if(exDef.mode==="bw"){
    const sets=last.sets.filter(s=>s.r);
    if(sets.length>=exDef.sets && sets.every(s=>s.r>=topReps))
      return "Todas al tope → agrega lastre o una serie más.";
  }else if(exDef.mode==="hold"){
    const sets=last.sets.filter(s=>s.s);
    if(sets.length>=exDef.sets && sets.every(s=>s.s>=exDef.secs))
      return "Holds completos → sube 5 s por lado o acorta la banda.";
  }
  return null;
}

<script>
/* ---------- Timer de descanso ---------- */
const Timer = {
  int:null, end:0,
  start(sec){
    sec = sec || (S.settings.restSec||90);
    this.lastBeep = null;
    audioCtx();
    this.end = Date.now()+sec*1000;
    document.getElementById("timerbar").style.display="flex";
    clearInterval(this.int);
    this.int=setInterval(()=>this.tick(),250);
    this.tick();
  },
  tick(){
    const left=Math.max(0,Math.round((this.end-Date.now())/1000));
    const m=Math.floor(left/60), s=left%60;
    document.getElementById("timerCount").textContent=m+":"+String(s).padStart(2,"0");
    document.getElementById("timerbar").classList.toggle("final", left<=10);
    if(left<=10 && left>0 && left!==this.lastBeep){ this.lastBeep=left; beepCountdown(left); }
    if(left<=0){ this.stop(); buzz(); beepEnd(); }
  },
  stop(){ clearInterval(this.int); document.getElementById("timerbar").style.display="none"; }
};
function buzz(){ try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){} }
/* Un solo AudioContext, desbloqueado al primer toque (iOS lo exige) */
let _actx=null;
function audioCtx(){
  try{
    if(!_actx) _actx=new (window.AudioContext||window.webkitAudioContext)();
    if(_actx.state==="suspended") _actx.resume();
    return _actx;
  }catch(e){ return null; }
}
document.addEventListener("pointerdown", ()=>audioCtx(), {passive:true});
function beep(freq, dur, vol){
  const ctx=audioCtx(); if(!ctx) return;
  try{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type="sine";
    o.frequency.value=freq||880;
    const t=ctx.currentTime, d=dur||0.35;
    g.gain.setValueAtTime(vol||0.18, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+d);
    o.start(t); o.stop(t+d);
  }catch(e){}
}
/* Cuenta regresiva: pitido corto en cada uno de los últimos 10 s,
   más agudo y más seguido en los últimos 3. */
function beepCountdown(left){
  if(left>3) beep(700, 0.10, 0.16);
  else { beep(1150, 0.13, 0.22); setTimeout(()=>beep(1150,0.10,0.18),160); }
}
/* Fin: doble tono largo, distinto de la cuenta regresiva */
function beepEnd(){
  beep(980, 0.30, 0.25);
  setTimeout(()=>beep(1320, 0.45, 0.25), 300);
}

/* ---------- Navegación ---------- */
let TAB="cierre";
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;

    else v.innerHTML=viewEntrenar();
  }
  else if(TAB==="historial") v.innerHTML=viewHistorial();
  else if(TAB==="progreso"){ v.innerHTML=viewProgreso(); drawCharts(); }
  else if(TAB==="datos") v.innerHTML=viewDatos();
  if(SUB!=="guion") window.scrollTo(0,0);
}

<script>
/* ============================================================
   VISTA: CIERRE DEL DÍA  — el flujo principal
   Un solo registro al final del día. Escribe en S.days y además
   genera las sesiones (fuerza/cardio) para que el historial y
   las gráficas de progresión sigan funcionando igual.
   ============================================================ */
function blankDay(iso){
  return {
    date: iso,
    cardio:{done:null, min:45, hrAvg:"", hrMax:"", cycles:3, incline:"", surge5:false, dist:"", kcal:""},
    fuerza:{routineId: DOW_ROUTINE[dowOf(iso)] || "", asPlanned:false, ex:{}, },
    habitos:{prot:"", crea:false, pasos:"", shakes:0, mcgill:false},
    salud:{sleepH:"", sleepScore:"", hrv:"", rhr:"", espalda:"", piel:""},
    nota:"",
    saved:false
  };
}
function getDay(iso){
  if(!S.days[iso]) S.days[iso]=blankDay(iso);
  const d=S.days[iso];
  d.cardio=d.cardio||{}; d.fuerza=d.fuerza||{ex:{}}; d.fuerza.ex=d.fuerza.ex||{};
  d.habitos=d.habitos||{}; d.salud=d.salud||{};
  return d;
}
let CIERRE_DATE = todayISO();

function weekCount(){
  const now=new Date(); const day=(now.getDay()+6)%7;
  const mon=new Date(now); mon.setDate(now.getDate()-day); mon.setHours(0,0,0,0);
  const monISO=mon.getFullYear()+"-"+String(mon.getMonth()+1).padStart(2,"0")+"-"+String(mon.getDate()).padStart(2,"0");
  let fuerza=0, cardio=0, dias=0;
  for(const iso of Object.keys(S.days)){
    if(iso<monISO) continue;
    const d=S.days[iso]; if(!d.saved) continue;
    dias++;
    if(d.fuerza && d.fuerza.routineId && d.fuerza.routineId!=="M" && d.fuerza.routineId!=="") fuerza++;
    if(d.cardio && d.cardio.done) cardio++;
  }
  return {fuerza,cardio,dias};
}
function streakCardio(){
  let n=0; const d=new Date();
  for(let i=0;i<400;i++){
    const iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const day=S.days[iso];
    if(day && day.saved && day.cardio && day.cardio.done) n++;
    else if(i>0 || (day&&day.saved)) break;
    d.setDate(d.getDate()-1);
  }
  return n;
}

function viewCierre(){
  const iso=CIERRE_DATE;
  const d=getDay(iso);
  const wk=weekCount();
  const dow=dowOf(iso);
  const planR=DOW_ROUTINE[dow]||null;
  let h="";
  if(MEM_FALLBACK) h+='<div class="banner">⚠️ El almacenamiento no está disponible aquí — los datos NO se guardarán al cerrar. Abre la app en Safari y usa Exportar como respaldo.</div>';

  h+='<div class="row between"><h2 style="margin:14px 0 6px">Cierre del día</h2>'
    +'<input type="date" id="cierreDate" value="'+iso+'" style="width:auto;padding:6px 10px;font-size:14px" onchange="CIERRE_DATE=this.value;render()"></div>';
  h+='<div class="sub" style="color:var(--muted);font-size:14px;margin-bottom:6px">'
    +(d.saved? '✅ Ya cerraste este día — puedes corregir y volver a guardar.' : 'Un solo registro al final del día. Nada de anotar actividad por actividad.')+'</div>';

  h+='<div class="kpi">'
    +'<div class="tile"><div class="v">'+wk.fuerza+'<span style="font-size:15px;color:var(--muted)">/3</span></div><div class="l">Fuerza esta semana</div></div>'
    +'<div class="tile"><div class="v">'+wk.cardio+'<span style="font-size:15px;color:var(--muted)">/7</span></div><div class="l">Cardio esta semana</div></div>'
    +'<div class="tile"><div class="v">'+streakCardio()+'</div><div class="l">Racha de cardio (días)</div></div>'
    +'</div>';

  /* --- CARDIO --- */
  h+='<h3>🏃 Cardio de la mañana</h3><div class="card">';
  h+='<div class="seg" style="margin-bottom:6px">'
    +segBtn("Hecho ✓", d.cardio.done===true, "setDayVal(\'cardio\',\'done\',true)")
    +segBtn("No lo hice", d.cardio.done===false, "setDayVal(\'cardio\',\'done\',false)")
    +'</div>';
  if(d.cardio.done){
    h+='<div class="grid3">'
      +numF("Min","c_min",d.cardio.min)
      +numF("FC prom","c_hrAvg",d.cardio.hrAvg)
      +numF("FC máx","c_hrMax",d.cardio.hrMax)
      +'</div><div class="grid3">'
      +numF("Ciclos (de 3)","c_cycles",d.cardio.cycles)
      +numF("Incl. máx %","c_incline",d.cardio.incline)
      +numF("Millas","c_dist",d.cardio.dist)
      +'</div>';
    h+='<div class="checkitem '+(d.cardio.surge5?"on":"")+'" onclick="toggleDay(\'cardio\',\'surge5\')" style="margin-top:6px">'
      +'<div class="box">'+(d.cardio.surge5?"✓":"")+'</div>'
      +'<div class="t">Hice el burst de 5.0 mph<div class="d">Solo con espalda 🟢 y en el surge 3</div></div></div>';

        h+='<input type="number" inputmode="numeric" id="fx_'+e.id+'_r" value="'+rp+'" onchange="setEx(\''+e.id+'\')"><span>reps +</span>'
          +'<input type="number" inputmode="decimal" id="fx_'+e.id+'_w" placeholder="lastre" value="'+(cur.w!=null?cur.w:"")+'" onchange="setEx(\''+e.id+'\')"><span>lb</span>';
      }else{
        h+='<input type="number" inputmode="decimal" id="fx_'+e.id+'_w" value="'+w+'" onchange="setEx(\''+e.id+'\')"><span>lb ×</span>'

      h+='</div>';
      h+= rpeRow(cur.rpe||null, "setRPE('"+e.id+"',%V%)");

      if(hint) h+='<div class="hint up" style="margin:8px 0 0">📈 '+esc(hint)+'</div>';
      h+='</div>';
    }

  h+='</div>';

  /* --- HÁBITOS --- */
  h+='<h3>🥩 Hábitos</h3><div class="card">';
  h+='<div class="grid3">'+numF("Proteína (g)","h_prot",d.habitos.prot)+numF("Pasos","h_pasos",d.habitos.pasos)+numF("Merengadas","h_shakes",d.habitos.shakes)+'</div>';
  h+='<div class="checkitem '+(d.habitos.crea?"on":"")+'" onclick="toggleDay(\'habitos\',\'crea\')"><div class="box">'+(d.habitos.crea?"✓":"")+'</div><div class="t">Creatina 5 g<div class="d">Todos los días, también en descanso</div></div></div>';
  h+='<div class="checkitem '+(d.habitos.mcgill?"on":"")+'" onclick="toggleDay(\'habitos\',\'mcgill\')"><div class="box">'+(d.habitos.mcgill?"✓":"")+'</div><div class="t">McGill Big 3 + movilidad<div class="d">8 min — el seguro de L2–S1</div></div></div>';
  if(d.habitos.prot && +d.habitos.prot<180)
    h+='<div class="hint">Faltan '+(180-(+d.habitos.prot))+' g para el piso de 180. Con incretina activa, la proteína no es suplemento: es lo que decide si la pérdida de peso sale de la grasa o del músculo.</div>';
  h+='</div>';

  /* --- SALUD --- */
  h+='<h3>❤️ Salud del día</h3><div class="card">';
  h+='<div class="grid2">'+numF("😴 Horas sueño","s_sleepH",d.salud.sleepH)+numF("Sleep score","s_sleepScore",d.salud.sleepScore)+'</div>';
  h+='<div class="grid2">'+numF("HRV Oura","s_hrv",d.salud.hrv)+numF("RHR ⭐","s_rhr",d.salud.rhr)+'</div>';
  h+='<label class="f">Espalda (L2–S1)</label><div class="seg tri">'
    +segBtn("🟢 Sin síntomas", d.salud.espalda==="verde","setDayVal(\'salud\',\'espalda\',\'verde\')","g")
    +segBtn("🟡 Rigidez", d.salud.espalda==="amarillo","setDayVal(\'salud\',\'espalda\',\'amarillo\')","y")
    +segBtn("🔴 Irradiado", d.salud.espalda==="rojo","setDayVal(\'salud\',\'espalda\',\'rojo\')","r")
    +'</div>';
  if(d.salud.espalda==="rojo") h+='<div class="banner">🔴 Dolor irradiado a pierna izquierda = tu síntoma centinela. STOP golf, tenis, touch, trote y surges. Solo caminata plana y McGill hasta que ceda. Este es el síntoma centinela, no el dolor lumbar local.</div>';
  h+='<label class="f">Piel / eczema</label><div class="seg tri">'
    +segBtn("Sin brote", d.salud.piel==="ok", "setDayVal(\'salud\',\'piel\',\'ok\')","g")
    +segBtn("Brote", d.salud.piel==="brote", "setDayVal(\'salud\',\'piel\',\'brote\')","y")
    +'</div>';
  h+='</div>';

  h+='<label class="f">Notas del día (craving, energía, contexto, molestias)</label>'
    +'<textarea id="d_nota" onchange="getDay(CIERRE_DATE).nota=this.value;saveState()">'+esc(d.nota||"")+'</textarea>';

  h+='<div class="row" style="margin:16px 0">'
    +'<button class="primary" style="flex:2" onclick="saveCierre()">✅ Guardar cierre del día</button>'
    +'<button style="flex:1" onclick="copyCierre()">📋 Copiar</button></div>';
  h+='<div class="sub" id="expMsg" style="text-align:center;color:var(--good-text)"></div>';

  /* Plan de la semana */
  h+='<h3>📅 La semana</h3><div class="card">';
  for(const w of WEEK_PLAN){
    const isToday = w.d.toLowerCase().startsWith(["domingo","lunes","martes","miércoles","jueves","viernes","sábado"][dow].slice(0,4));
    h+='<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--grid)'+(isToday?';font-weight:700;color:var(--accent)':'')+'">'
      +'<span>'+w.d+'</span><span style="font-size:14px;text-align:right">'+w.c+(w.f!=="—"? ' <span class="pill blue" style="margin-left:6px">'+w.f.split(" —")[0]+'</span>':'')+(w.s? ' <span class="pill green" style="margin-left:4px">'+w.s+'</span>':'')+'</span></div>';
  }
  h+='<div class="safety" style="margin-top:8px">Días con deporte: el cardio de la mañana baja a 30 min (2 ciclos). Nunca fuerza pesada el mismo día que doble ronda de golf. 🏉 Touch = CERO contacto, domingos alternos.</div></div>';

  h+='<div class="card"><b>Reglas de la casa</b>'
    +'<div class="safety">❌ Sin carga axial (L2–S1) · ❌ Sin impacto salvo el burst autorizado · ✅ Exhalar en el esfuerzo, nunca Valsalva (CAC 385.9) · ✅ 1–2 reps en reserva, nunca al fallo · ✅ La FC manda sobre el número en la app · 🛑 Dolor torácico, disnea desproporcionada o mareo → parar y consultar.</div></div>';

}
function segBtn(label,on,onclick,cls){
  return '<button class="'+(on?"on "+(cls||""):"")+'" onclick="'+onclick+'">'+label+'</button>';
}
function numF(label,id,val){
  return '<div><label class="f">'+label+'</label><input type="number" inputmode="decimal" id="'+id+'" value="'+(val==null?"":val)+'" onchange="syncFields()"></div>';
}
function setDayVal(sec,key,val){ const d=getDay(CIERRE_DATE); syncFields(); d[sec][key]=val; saveState(); render(); }
function toggleDay(sec,key){ const d=getDay(CIERRE_DATE); syncFields(); d[sec][key]=!d[sec][key]; saveState(); render(); }
function pickRoutine(id){ const d=getDay(CIERRE_DATE); syncFields(); d.fuerza.routineId=id; saveState(); render(); }
function gv(id){ const el=document.getElementById(id); if(!el) return undefined; const v=el.value.trim(); return v===""? "" : (isNaN(parseFloat(v))? v : parseFloat(v)); }
function syncFields(){
  const d=getDay(CIERRE_DATE);
  const map={c_min:["cardio","min"],c_hrAvg:["cardio","hrAvg"],c_hrMax:["cardio","hrMax"],c_cycles:["cardio","cycles"],
    c_incline:["cardio","incline"],c_dist:["cardio","dist"],
    h_prot:["habitos","prot"],h_pasos:["habitos","pasos"],h_shakes:["habitos","shakes"],
    s_sleepH:["salud","sleepH"],
    s_sleepScore:["salud","sleepScore"],s_hrv:["salud","hrv"],s_rhr:["salud","rhr"]};
  for(const id in map){ const v=gv(id); if(v!==undefined) d[map[id][0]][map[id][1]]=v; }
  const nt=document.getElementById("d_nota"); if(nt) d.nota=nt.value;
  if(d.fuerza.routineId){
    const r=routineById(d.fuerza.routineId);
    if(r) for(const e of r.exercises) readEx(e,d);
  }
  saveState();
}
function readEx(e,d){
  const g=k=>{ const el=document.getElementById("fx_"+e.id+"_"+k); return el? el.value.trim():null; };
  const o=d.fuerza.ex[e.id]||{};
  const w=g("w"), r=g("r"), s=g("s"), b=g("b"), n=g("n");
  if(w!==null) o.w = w===""? null : parseFloat(w);
  if(r!==null && r!=="") o.r=parseFloat(r);
  if(s!==null && s!=="") o.s=parseFloat(s);
  if(b!==null) o.band=b;
  if(n!==null && n!=="") o.sets=parseInt(n);
  d.fuerza.ex[e.id]=o;
}
function setEx(exId){ syncFields(); }
function setRPE(exId, v){
  const d=getDay(CIERRE_DATE); syncFields();
  d.fuerza.ex[exId]=d.fuerza.ex[exId]||{};
  d.fuerza.ex[exId].rpe = (d.fuerza.ex[exId].rpe===v)? null : v;
  saveState(); render();
}
function setActRPE(i, v){
  const ex=S.active.exercises[i];
  ex.rpe = (ex.rpe===v)? null : v;
  saveState(); render();
}
/* Prescripción: última sesión si existe, si no el arranque del plan */
function prescribeFor(e){
  const last=lastPerf(e.id);
  if(!(last && last.sets.length))
    return {w: e.startW||"", r: e.reps? e.reps[0] : "", band:"", s: e.secs||30, note:null};
  const best=last.sets.reduce((a,b)=> (b.w||0)>(a.w||0)? b:a, last.sets[0]);
  let w = best.w!=null? best.w : (e.startW||"");
  let r = best.r!=null? best.r : (e.reps? e.reps[0]:"");
  let sec = best.s!=null? best.s : (e.secs||30);
  const band = best.band||"";
  const lo = e.reps? e.reps[0] : null, hi = e.reps? e.reps[1] : null;
  const rpe = last.rpe;
  let note = null;

  if(rpe===1){
    if(e.mode==="hold"){ sec=sec+10; note="Esfuerzo 1 la vez pasada → subimos a "+sec+" s."; }
    else if(e.mode==="band"){ note="Esfuerzo 1 la vez pasada → banda más fuerte, o aléjate del anclaje. Anota la nueva tensión."; }
    else if(hi && r<hi){ r=r+1; note="Esfuerzo 1 la vez pasada → subimos a "+r+" reps."; }
    else if(e.mode==="bw"){ r=r+2; note="Esfuerzo 1 la vez pasada y ya estabas al tope → "+r+" reps, o agrega lastre."; }
    else {
      const nx=nextDBStep(w);
      if(nx){ note="Esfuerzo 1 con "+w+" lb al tope del rango → subimos a "+nx+" lb y volvemos a "+lo+" reps."; w=nx; r=lo; }
      else note="Esfuerzo 1 en el techo del inventario ("+w+" lb) → suma una serie o tempo 3-1-1.";
    }
  } else if(rpe===2){
    if(hi && r<hi && e.mode!=="hold" && e.mode!=="band"){ r=r+1; note="Esfuerzo 2 → +1 rep, margen de sobra."; }
  } else if(rpe===5){
    if(e.mode==="hold"){ note="Esfuerzo 5 la vez pasada → mantén "+sec+" s, no lo subas."; }
    else if(e.mode==="band"){ note="Esfuerzo 5 la vez pasada → misma banda o más suave. No progreses hoy."; }
    else if(lo && r>lo){ r=lo; note="Esfuerzo 5 la vez pasada → mismo peso, bajamos a "+lo+" reps."; }
    else {
      const pv=prevDBStep(w);
      if(pv && (e.mode==="w"||e.mode==="carry")){ note="Esfuerzo 5 con "+w+" lb ya en el piso del rango → bajamos a "+pv+" lb."; w=pv; }
      else note="Esfuerzo 5 → mantén y consolida antes de subir.";
    }
  }
  return {w, r, band, s:sec, note};
}
function targetLabel(e){
  if(e.mode==="hold") return e.sets+" × "+e.secs+" s"+(e.perSide?" c/lado":"");
  const r=e.reps? (e.reps[0]===e.reps[1]? e.reps[0] : e.reps[0]+"–"+e.reps[1]) : "";
  if(e.mode==="carry") return e.sets+" × "+r+" pasos c/lado";
  return e.sets+" × "+r+(e.perSide?" c/lado":"");
}

/* Guardar cierre → escribe S.days y regenera las sesiones del día */
function saveCierre(){
  syncFields();
  const iso=CIERRE_DATE, d=getDay(iso);
  d.saved=true;
  /* limpia sesiones previas generadas por el cierre de ese día */
  S.sessions=S.sessions.filter(s=>!(s.date===iso && s.src==="cierre"));
  if(d.cardio.done){
    S.sessions.push({id:uid(), date:iso, type:"cardio", src:"cierre", name:"Cardio Trabajo — intervalos",
      cardio:{kind:"trabajo", min:d.cardio.min||null, hrAvg:d.cardio.hrAvg||null, hrMax:d.cardio.hrMax||null,
        incline:d.cardio.incline||null, dist:d.cardio.dist||null,
        note:(d.cardio.cycles? d.cardio.cycles+" ciclos":"")+(d.cardio.surge5? " · burst 5.0 mph":"")}});
  }
  if(d.fuerza.routineId){
    const r=routineById(d.fuerza.routineId);
    const exs=[];
    for(const e of r.exercises){
      const o=d.fuerza.ex[e.id]; if(!o) continue;
      const n=o.sets||e.sets; const sets=[];
      for(let i=0;i<n;i++){
        if(e.mode==="hold"){ if(o.s) sets.push({s:o.s, band:o.band||undefined}); }
        else if(e.mode==="band"){ if(o.r) sets.push({band:o.band||"banda", r:o.r}); }
        else if(e.mode==="bw"){ if(o.r) sets.push(o.w? {r:o.r,w:o.w} : {r:o.r}); }
        else { if(o.r && o.w!=null) sets.push({w:o.w, r:o.r}); }
      }
      if(sets.length) exs.push({exId:e.id, name:e.name, mode:e.mode, sets, rpe:(o.rpe||null)});
    }
    if(exs.length) S.sessions.push({id:uid(), date:iso, type:"fuerza", src:"cierre",
      routineId:r.id, name:r.name, exercises:exs, note:d.nota||""});
  }
  /* checklist legacy, para no romper exportaciones viejas */
  S.checklist[iso]=S.checklist[iso]||{};
  S.checklist[iso].sesion = !!(d.cardio.done || d.fuerza.routineId);
  S.checklist[iso].mcgill = !!d.habitos.mcgill;
  S.checklist[iso].crea = !!d.habitos.crea;
  S.checklist[iso].prot = (+d.habitos.prot)>=180;
  S.checklist[iso].prot1 = (+d.habitos.shakes)>=1;
  S.checklist[iso].prot2 = (+d.habitos.shakes)>=2;
  S.checklist[iso].pasos = (+d.habitos.pasos)>=8000;
  saveState();
  const m=document.getElementById("expMsg");
  render();
  const m2=document.getElementById("expMsg"); if(m2){ m2.textContent="Cierre guardado ✓"; setTimeout(()=>{const x=document.getElementById("expMsg"); if(x) x.textContent="";},4000); }
}
function cierreText(iso){
  const d=getDay(iso);
  let o="CIERRE — "+iso+"\n";
  o+="Cardio: "+(d.cardio.done? ((d.cardio.min||"?")+" min · FC "+(d.cardio.hrAvg||"?")+" prom / "+(d.cardio.hrMax||"?")+" máx · "
      +(d.cardio.cycles||"?")+" ciclos · incl máx "+(d.cardio.incline||"?")+"%"+(d.cardio.surge5?" · burst 5.0 mph":"")) : "no")+"\n";
  if(d.fuerza.routineId){
    const r=routineById(d.fuerza.routineId);
    o+="Fuerza: "+r.name+"\n";
    for(const e of r.exercises){
      const x=d.fuerza.ex[e.id]; if(!x) continue;
      let v="";
      if(e.mode==="hold") v=(x.s||"?")+" s";
      else if(e.mode==="band") v=(x.band||"banda")+" × "+(x.r||"?");
      else if(e.mode==="bw") v=(x.r||"?")+" reps"+(x.w?" +"+x.w+" lb":"");
      else v=(x.w!=null?x.w:"?")+" lb × "+(x.r||"?");
      o+="  - "+e.name.replace(/[🏌️🎾⭐🏃]/g,"").trim()+": "+(x.sets||e.sets)+" × "+v+(x.rpe? "  [esfuerzo "+x.rpe+"/5]":"")+"\n";
    }
  } else o+="Fuerza: no\n";
  o+="Hábitos: proteína "+(d.habitos.prot||"?")+" g · "+(d.habitos.shakes||0)+" merengadas · pasos "+(d.habitos.pasos||"?")
    +" · creatina "+(d.habitos.crea?"sí":"no")+" · McGill "+(d.habitos.mcgill?"sí":"no")+"\n";
  o+="Salud: sueño "+(d.salud.sleepH||"?")+" h (score "+(d.salud.sleepScore||"?")+") · HRV "+(d.salud.hrv||"?")
    +" · RHR "+(d.salud.rhr||"?")+" · espalda "+(d.salud.espalda||"?")+" · piel "+(d.salud.piel||"?")+"\n";
  if(d.nota) o+="Notas: "+d.nota+"\n";
  return o;
}
function copyCierre(){ syncFields(); copyOrDownload(cierreText(CIERRE_DATE), "cierre.txt", "Cierre copiado ✓"); }

/* ---------- GUION DE INTERVALOS ---------- */
const Guion = {
  i:0, left:0, running:false, int:null, startTs:0,
  reset(){ this.i=0; this.left=INTERVAL_PLAN[0].sec; this.running=false; clearInterval(this.int); this.int=null; },
  toggle(){
    if(this.running){ this.running=false; clearInterval(this.int); this.int=null; }
    else{
      this.running=true;
      audioCtx();
      if(!this.startTs) this.startTs=Date.now();
      this.int=setInterval(()=>{
        this.left--;
        if(this.left<=0){ this.next(true); }
        else if(this.left<=10) beepCountdown(this.left);
        this.paint();
      },1000);
    }
    this.paint();
  },
  next(auto){
    if(this.i>=INTERVAL_PLAN.length-1){
      this.running=false; clearInterval(this.int); this.int=null;
      this.i=INTERVAL_PLAN.length-1; this.left=0; buzz(); beepEnd();
      this.paint(); return;
    }
    this.i++; this.left=INTERVAL_PLAN[this.i].sec;
    if(auto){ buzz(); beepEnd(); }
    this.paint();
  },
  prev(){ if(this.i>0){ this.i--; this.left=INTERVAL_PLAN[this.i].sec; this.paint(); } },
  elapsed(){ let e=0; for(let k=0;k<this.i;k++) e+=INTERVAL_PLAN[k].sec; return e+(INTERVAL_PLAN[this.i].sec-this.left); },
  paint(){
    const p=INTERVAL_PLAN[this.i];
    const big=document.getElementById("gBig"); if(!big) return;
    big.className="phasebig"+(p.work?"":" surge");
    document.getElementById("gT").textContent=p.t;
    document.getElementById("gC").textContent=mmss(this.left);
    document.getElementById("gSpd").textContent=p.spd;
    document.getElementById("gInc").textContent=p.inc;
    document.getElementById("gHr").textContent=p.hr;
    document.getElementById("gNote").textContent=p.note||"";
    document.getElementById("gPlay").textContent=this.running? "⏸ Pausa" : (this.elapsed()>0? "▶︎ Seguir":"▶︎ Empezar");
    document.getElementById("gElap").textContent=mmss(this.elapsed())+" / "+mmss(INTERVAL_TOTAL);
    document.getElementById("gBar").style.width=Math.min(100,100*this.elapsed()/INTERVAL_TOTAL)+"%";
    document.querySelectorAll("#gList .p").forEach((el,k)=>{
      el.classList.toggle("now",k===this.i);
      el.classList.toggle("past",k<this.i);
    });
  }
};

  let h='<div class="row between"><h2 style="margin:14px 0 4px">Cardio Trabajo</h2>'
    +'<button class="small ghost" onclick="SUB=null;Guion.reset();render()">← Salir</button></div>';
  h+='<div class="sub" style="color:var(--muted);font-size:14px">45 min · 6 am en ayunas · MyRun. Los bloques largos van a ≤2.4 mph: ahí trabajas. Los surges son 90 s: ahí no.</div>';

    +'<div class="ph-t" id="gT">—</div>'

      +'<div>FC<b id="gHr">—</b></div>'
    +'</div>'

    +'</div>';
  h+='<div class="progbar"><i id="gBar" style="width:0%"></i></div>'

    +'<span class="sub" style="color:var(--muted);font-size:13px">'+INTERVAL_PLAN.length+' fases</span></div>';
  h+='<div class="row" style="margin:12px 0">'

  h+='<div class="card phaselist" id="gList">';
  INTERVAL_PLAN.forEach((p,k)=>{
    h+='<div class="p"><span>'+esc(p.t)+'</span><span class="m">'+p.spd+' mph · '+p.inc+'% · '+mmss(p.sec)+'</span></div>';

/* ---------- Sesión de fuerza en vivo (opcional) ---------- */
function startStrength(rid){
  const r=routineById(rid);
  const low = isLow() && rid!=="M";
  S.active={ id:uid(), date:todayISO(), type:"fuerza", routineId:rid, name:r.name,
    startTs:Date.now(), note:"", low:low,
    exercises:r.exercises.map(e=>({exId:e.id, name:e.name, mode:e.mode, sets:[]})) };
  saveState(); TAB="entrenar"; SUB=null; render();
}
function viewActiveSession(){
  const a=S.active;
  const r=routineById(a.routineId);
  /* Sesión activa creada por una versión anterior de la app: la rutina pudo
     cambiar de ejercicios. Reconciliamos por exId para no romper nada. */
  if(!r){
    return '<div class="card"><b>Sesión antigua</b><div class="sub">Esta sesión venía de una versión anterior con una rutina que ya no existe. Puedes guardarla como está o descartarla.</div>'
      +'<div class="row" style="margin-top:12px"><button class="primary" style="flex:2" onclick="finishSession()">Guardar</button>'
      +'<button class="danger" style="flex:1" onclick="discardSession()">Descartar</button></div></div>';
  }
  a.exercises = r.exercises.map(e=>{
    const prev=(a.exercises||[]).find(x=>x.exId===e.id);
    return prev? {exId:e.id, name:e.name, mode:e.mode, sets:prev.sets||[]}
               : {exId:e.id, name:e.name, mode:e.mode, sets:[]};
  });
  const mins=Math.round((Date.now()-a.startTs)/60000);
  let h='<div class="sessionhead"><h2 style="margin:0">'+esc(a.name)+'</h2>'
    +'<span class="pill">'+mins+' min</span></div>';
  if(a.low) h+='<div class="banner">🟠 Readiness baja: 1 serie menos por ejercicio. El McGill nunca se recorta.</div>';
  if(r && r.note) h+='<div class="banner">'+esc(r.note)+'</div>';
  let lastBlock=null;
  r.exercises.forEach((exDef,i)=>{
    if(exDef.block==="disoc" && lastBlock!=="disoc"){
      h+='<h3 style="color:var(--s3)">🔄 Bloque de disociación — cadera / hombros</h3>'
        +'<div class="sub" style="color:var(--muted);font-size:13.5px;margin-bottom:4px">Golf y tenis viven aquí. La cadera gira, la columna transmite. Nunca al revés.</div>';
    }
    lastBlock=exDef.block;
    const ex=a.exercises[i];
    const last=lastPerf(exDef.id, a.id);
    const hint=progressionHint(exDef,last);
    const done=ex.sets.length>=tgtSets(exDef);
    h+='<div class="card '+(done?"exdone":"")+'">';
    h+='<div class="row between"><b>'+(exDef.pair?'<span class="pairtag">'+exDef.pair+' </span>':'')+esc(exDef.name)+'</b>'
      +'<span class="pill">'+targetLabel(exDef)+(exDef.startW?(" · "+exDef.startW+" lb"):"")+'</span></div>';
    if(exDef.tip) h+='<div class="safety">'+esc(exDef.tip)+'</div>';
    if(last) h+='<div class="prev">La vez pasada ('+fmtDate(last.date)+'): '
      + last.sets.map(s=>setLabel(exDef.mode,s)).join(" · ")+'</div>';
    if(hint) h+='<div class="hint up">📈 '+esc(hint)+'</div>';
    for(let si=0; si<ex.sets.length; si++){
      h+='<div class="setrow"><span class="n">'+(si+1)+'</span>'
        +'<span style="flex:1">'+setLabel(exDef.mode,ex.sets[si])+deltaBadge(exDef,ex.sets[si],last,si)+'</span>'
        +'<span class="done" style="margin-right:4px">✓</span>'
        +'<button class="small ghost" onclick="delSet('+i+','+si+')">✕</button></div>';
    }
    for(let si=ex.sets.length; si<tgtSets(exDef); si++) h+=inputRowPre(exDef,i,si,ex,last);
    if(ex.sets.length>=tgtSets(exDef))
      h+='<div style="margin-top:6px"><button class="small ghost" onclick="addExtraRow('+i+')">＋ serie extra</button></div>';
    if(a.extraRows && a.extraRows[i]>0){
      for(let k=0;k<a.extraRows[i];k++) h+=inputRowPre(exDef,i,tgtSets(exDef)+k,ex,last);
    }
    if(ex.sets.length) h+= rpeRow(ex.rpe||null, "setActRPE("+i+",%V%)");
    h+='</div>';
  });
  h+='<label class="f">Notas de la sesión</label>'
    +'<textarea id="sessNote" oninput="S.active.note=this.value">'+esc(a.note||"")+'</textarea>';
  h+='<div class="row" style="margin:16px 0">'
    +'<button class="primary" style="flex:2" onclick="finishSession()">✅ Terminar y guardar</button>'
    +'<button class="danger" style="flex:1" onclick="discardSession()">Descartar</button></div>';
  return h;
}
function deltaBadge(exDef,st,last,si){
  if(!last) return "";
  const prev = last.sets[si] || last.sets[last.sets.length-1];
  if(!prev) return "";
  let d=null, unit="";
  if((exDef.mode==="w"||exDef.mode==="carry") && st.w!=null && prev.w!=null){ d=st.w-prev.w; unit=" lb"; }
  else if(exDef.mode==="bw" && st.r!=null && prev.r!=null){ d=st.r-prev.r; unit=""; }
  else if(exDef.mode==="hold" && st.s!=null && prev.s!=null){ d=st.s-prev.s; unit=" s"; }
  if(d==null || d===0) return "";
  return d>0? '<span class="delta up">▲+'+d+unit+'</span>' : '<span class="delta dn">▼'+d+unit+'</span>';
}
function inputRowPre(exDef,i,si,ex,last){
  const prevSet = ex.sets.length? ex.sets[ex.sets.length-1] : null;
  const lastAt = last? (last.sets[si] || last.sets[last.sets.length-1]) : null;
  const suggW = (prevSet&&prevSet.w!=null)? prevSet.w : (lastAt&&lastAt.w!=null? lastAt.w : exDef.startW||"");
  const suggR = (lastAt&&lastAt.r!=null)? lastAt.r : (prevSet&&prevSet.r!=null? prevSet.r : (exDef.reps? exDef.reps[0] : ""));
  const suggS = (lastAt&&lastAt.s!=null)? lastAt.s : (prevSet&&prevSet.s!=null? prevSet.s : exDef.secs||30);
  const suggB = (prevSet&&prevSet.band)? prevSet.band : (lastAt&&lastAt.band? lastAt.band : "");
  const k=i+"_"+si;
  let fields="";
  if(exDef.mode==="w" || exDef.mode==="carry"){
    fields='<input type="number" inputmode="decimal" id="w'+k+'" placeholder="lb" value="'+suggW+'">'
      +'<span class="x">×</span>'
      +'<input type="number" inputmode="numeric" id="r'+k+'" placeholder="'+(exDef.mode==="carry"?"pasos":"reps")+'" value="'+suggR+'">';
  }else if(exDef.mode==="bw"){
    fields='<input type="number" inputmode="numeric" id="r'+k+'" placeholder="reps" value="'+suggR+'">'
      +'<span class="x">+</span>'
      +'<input type="number" inputmode="decimal" id="w'+k+'" placeholder="lastre" value="'+(lastAt&&lastAt.w?lastAt.w:"")+'">';
  }else if(exDef.mode==="band"){
    fields='<input type="text" id="b'+k+'" placeholder="banda (color/tensión)" style="width:150px" value="'+esc(suggB)+'">'
      +'<span class="x">×</span>'
      +'<input type="number" inputmode="numeric" id="r'+k+'" placeholder="reps" value="'+suggR+'">';
  }else if(exDef.mode==="hold"){
    fields='<input type="number" inputmode="numeric" id="s'+k+'" placeholder="seg" value="'+suggS+'">'
      +'<span class="x">s</span>'
      +'<input type="text" id="b'+k+'" placeholder="banda (opc.)" style="width:130px" value="'+esc(suggB)+'">';
  }
  return '<div class="setrow pending"><span class="n">'+(si+1)+'</span>'+fields
    +'<button class="primary small confirmbtn" onclick="logSetRow('+i+','+si+')">✓</button></div>';
}
function num(id){ const el=document.getElementById(id); if(!el) return null; const v=parseFloat(el.value); return isNaN(v)?null:v; }
function txt(id){ const el=document.getElementById(id); return el? el.value.trim():""; }
function logSetRow(i,si){
  const a=S.active; const exDef=routineById(a.routineId).exercises[i];
  const k=i+"_"+si;
  const st={};
  if(exDef.mode==="hold"){ st.s=num("s"+k); const b=txt("b"+k); if(b) st.band=b; if(!st.s) return; }
  else if(exDef.mode==="band"){ st.band=txt("b"+k)||"banda"; st.r=num("r"+k); if(!st.r) return; }
  else {
    st.w=num("w"+k); st.r=num("r"+k);
    if(!st.r) return;
    if(exDef.mode==="w"&&st.w==null) return;
    if(exDef.mode==="bw"&&st.w==null) delete st.w;
  }
  a.exercises[i].sets.push(st);
  if(a.exercises[i].sets.length>tgtSets(exDef) && a.extraRows && a.extraRows[i]>0) a.extraRows[i]--;
  saveState(); Timer.start(); render();
}
function addExtraRow(i){
  S.active.extraRows=S.active.extraRows||{};
  S.active.extraRows[i]=(S.active.extraRows[i]||0)+1;
  render();
}
function delSet(i,si){ S.active.exercises[i].sets.splice(si,1); saveState(); render(); }
function finishSession(){
  const a=S.active;
  a.exercises=a.exercises.filter(e=>e.sets.length);
  if(!a.exercises.length){ discardSession(); return; }
  a.durMin=Math.round((Date.now()-a.startTs)/60000);
  S.sessions.push(a);
  /* refleja la sesión en el cierre del día para no duplicar trabajo */
  const dd=getDay(a.date);
  if(a.routineId!=="M"){
    dd.fuerza.routineId=a.routineId;
    for(const ex of a.exercises){
      const best=ex.sets.reduce((x,y)=> (y.w||y.r||0)>(x.w||x.r||0)? y:x, ex.sets[0]);
      dd.fuerza.ex[ex.exId]={w:best.w!=null?best.w:null, r:best.r||null, s:best.s||null, band:best.band||"", sets:ex.sets.length, rpe:(ex.rpe||null)};
    }
  } else dd.habitos.mcgill=true;
  S.active=null;
  saveState(); Timer.stop(); TAB="cierre"; SUB=null; render();
}
function discardSession(){
  if(!confirm("¿Descartar la sesión sin guardar?")) return;
  S.active=null; saveState(); Timer.stop(); render();
}

/* ---------- Cardio manual ---------- */
let cardioKind=null;
function openCardio(kind){ cardioKind=kind; SUB="cardio"; render(); }
function viewCardioForm(){
  const c=CARDIO_TYPES.find(x=>x.id===cardioKind);
  let h='<h2>'+esc(c.name)+'</h2>';
  if(c.target) h+='<div class="banner">🎯 '+esc(c.target)+'</div>';
  let lastC=null;
  for(let i=S.sessions.length-1;i>=0;i--){
    const s=S.sessions[i];
    if(s.type==="cardio"&&s.cardio.kind===cardioKind){ lastC=s.cardio; break; }
  }
  if(lastC) h+='<div class="prev">⚡ Precargado con tu última sesión — corrige lo que cambió y guarda.</div>';
  h+='<div class="card"><div class="grid2">';
  for(const f of c.fields){
    const pv=(lastC&&lastC[f]!=null)? lastC[f] : "";
    h+='<div><label class="f">'+CARDIO_FIELD_LABELS[f]+'</label>'
      +'<input type="number" inputmode="decimal" id="cf_'+f+'" value="'+pv+'"></div>';
  }
  h+='</div><label class="f">Fecha</label><input type="date" id="cf_date" value="'+todayISO()+'">'
    +'<label class="f">Notas</label><textarea id="cf_note"></textarea></div>';
  h+='<div class="row" style="margin:16px 0">'
    +'<button class="primary" style="flex:2" onclick="saveCardio()">✅ Guardar</button>'
    +'<button style="flex:1" onclick="SUB=null;render()">Cancelar</button></div>';
  return h;
}
function saveCardio(){
  const c=CARDIO_TYPES.find(x=>x.id===cardioKind);
  const data={kind:cardioKind, note:txt("cf_note")};
  let any=false;
  for(const f of c.fields){ const v=num("cf_"+f); if(v!=null){ data[f]=v; any=true; } }
  if(!any){ alert("Registra al menos un dato (duración, FC…)"); return; }
  const date=txt("cf_date")||todayISO();
  S.sessions.push({id:uid(), date, type:"cardio", name:c.name, cardio:data});
  saveState(); TAB="cierre"; SUB=null; CIERRE_DATE=date; render();
}
</script>
<script>
/* ---------- VISTA: HISTORIAL ---------- */
function sessionSummary(s){
  if(s.type==="cardio"){
    const c=s.cardio; let parts=[];
    if(c.min) parts.push(c.min+" min");
    if(c.hrAvg) parts.push("FC "+c.hrAvg);
    if(c.hrMax) parts.push("máx "+c.hrMax);
    if(c.incline) parts.push(c.incline+"%");
    if(c.kcal) parts.push(c.kcal+" kcal");
    return parts.join(" · ")||"—";
  }
  const nEx=(s.exercises||[]).filter(e=>e.sets.length).length;
  const nSets=(s.exercises||[]).reduce((a,e)=>a+e.sets.length,0);
  return nEx+" ejercicios · "+nSets+" series";
}
function viewHistorial(){
  const dates=[...new Set([...S.sessions.map(s=>s.date), ...Object.keys(S.days).filter(k=>S.days[k].saved)])].sort().reverse();
  if(!dates.length) return '<h2>Historial</h2><div class="card">Aún no hay días cerrados. Empieza en la pestaña Cierre. 💪</div>';
  let h='<h2>Historial</h2>';
  for(const date of dates){
    h+='<h3>'+fmtDate(date)+'</h3>';
    const d=S.days[date];
    if(d && d.saved){
      h+='<div class="card"><div class="row between"><b>Cierre del día</b>'
        +'<button class="small ghost" onclick="CIERRE_DATE=\''+date+'\';TAB=\'cierre\';SUB=null;render()">Abrir</button></div>'
        +'<div class="sub" style="white-space:pre-wrap;font-size:13.5px">'+esc(cierreText(date).split("\n").slice(1).join("\n").trim())+'</div></div>';
    }
    for(const s of S.sessions.filter(x=>x.date===date)){
      if(s.src==="cierre") continue;
      h+='<div class="card"><div class="row between"><b>'+esc(s.name)+'</b>'
        +'<span class="pill '+(s.type==="fuerza"?"blue":"orange")+'">'+(s.type==="fuerza"?"fuerza":"cardio")+'</span></div>'
        +'<div class="sub">'+sessionSummary(s)+(s.durMin? " · "+s.durMin+" min":"")+'</div>';
      if(s.type==="fuerza"){
        h+='<details><summary style="font-size:14px;color:var(--accent)">Ver series</summary>';
        for(const ex of s.exercises){
          h+='<div style="margin:8px 0"><b style="font-size:14.5px">'+esc(ex.name)+'</b>';
          const best=ex.mode==="w"? Math.max(...ex.sets.map(x=>est1RM(x.w,x.r))) : 0;
          if(best) h+=' <span class="tag1rm">1RM est. '+best+' lb</span>';
          if(ex.rpe) h+=' <span class="tag1rm">· esfuerzo '+ex.rpe+'/5</span>';
          h+='<div class="histset">'+ex.sets.map(x=>setLabel(ex.mode,x)).join(" · ")+'</div></div>';
        }
        h+='</details>';
      }
      if(s.note) h+='<div class="safety">📝 '+esc(s.note)+'</div>';
      if(s.cardio && s.cardio.note) h+='<div class="safety">📝 '+esc(s.cardio.note)+'</div>';
      h+='<div class="row" style="margin-top:8px"><button class="small danger" onclick="delSession(\''+s.id+'\')">Borrar</button></div></div>';
    }
  }
  return h;
}
function delSession(id){
  if(!confirm("¿Borrar esta sesión del log?")) return;
  S.sessions=S.sessions.filter(s=>s.id!==id);
  saveState(); render();
}
</script>
<script>
/* ---------- VISTA: PROGRESO ---------- */
let progExId=null;
function trackedExercises(){
  const seen=new Map();
  for(const s of S.sessions){
    if(s.type!=="fuerza") continue;
    for(const ex of s.exercises){
      if((ex.mode==="w"||ex.mode==="bw") && ex.sets.length) seen.set(ex.exId, ex.name);
    }
  }
  return [...seen.entries()];
}
function viewProgreso(){
  const exs=trackedExercises();
  let h='<h2>Progreso</h2>';
  if(!S.sessions.length && !Object.keys(S.days).length) return h+'<div class="card">Cierra tu primer día y aquí aparecen las gráficas.</div>';
  h+='<div class="chartbox"><h3>Fuerza por ejercicio</h3>'
    +'<div class="sub">1RM estimado (Epley) — la métrica válida de progresión, no el volumen total</div>';
  if(exs.length){
    if(!progExId || !exs.find(e=>e[0]===progExId)) progExId=exs[0][0];
    h+='<select id="progSel" onchange="progExId=this.value;render()" style="margin-bottom:8px">';
    for(const [id,name] of exs) h+='<option value="'+id+'" '+(id===progExId?"selected":"")+'>'+esc(name)+'</option>';
    h+='</select><div id="chart1rm"></div>';
  } else h+='<div class="sub">Aún sin series de fuerza registradas.</div>';
  h+='</div>';
  h+='<div class="chartbox"><h3>Cardio — FC promedio</h3>'
    +'<div class="sub">Ventana de los bloques de trabajo 115–125 bpm (banda sombreada). Los surges suben el promedio: 118–128 en una sesión completa es correcto.</div><div id="chartz2"></div></div>';
  h+='<div class="chartbox"><h3>RHR — el veredicto del experimento</h3>'
    +'<div class="sub">Meta: volver a 57–58 bpm. Subió a 69 en el Mundial; el cardio diario es la vía de regreso.</div><div id="chartrhr"></div></div>';
  h+='<div class="chartbox"><h3>Sesiones por semana</h3>'
    +'<div class="sub">Meta: 3 fuerza + 7 cardio</div><div id="chartwk"></div>'
    +'<div class="legend"><span><span class="sw" style="background:var(--s1)"></span>Fuerza</span>'
    +'<span><span class="sw" style="background:var(--s2)"></span>Cardio</span></div></div>';
  return h;
}
function svgOpen(w,hh){ return '<svg viewBox="0 0 '+w+' '+hh+'" width="100%" style="display:block">'; }
function chartFrame(w,h,pad){
  let s="";
  for(let i=0;i<=3;i++){
    const y=pad.t+(h-pad.t-pad.b)*i/3;
    s+='<line x1="'+pad.l+'" y1="'+y+'" x2="'+(w-pad.r)+'" y2="'+y+'" stroke="var(--grid)" stroke-width="1"/>';
  }
  s+='<line x1="'+pad.l+'" y1="'+(h-pad.b)+'" x2="'+(w-pad.r)+'" y2="'+(h-pad.b)+'" stroke="var(--axis)" stroke-width="1"/>';
  return s;
}
function niceMax(v){ if(v<=10) return 10; const p=Math.pow(10,Math.floor(Math.log10(v))); return Math.ceil(v/(p/2))*(p/2); }
function ptTip(el){
  const tip=document.getElementById("tooltip");
  el.addEventListener("pointerenter",()=>{
    tip.textContent=el.dataset.tip; tip.style.display="block";
    const r=el.getBoundingClientRect();
    tip.style.left=(r.left+r.width/2+window.scrollX)+"px";
    tip.style.top=(r.top+window.scrollY)+"px";
  });
  el.addEventListener("pointerleave",()=>{ tip.style.display="none"; });
}
function bindTips(rootId){
  const root=document.getElementById(rootId); if(!root) return;
  root.querySelectorAll("[data-tip]").forEach(ptTip);
}
function drawCharts(){ draw1RM(); drawZ2(); drawRHR(); drawWeeks(); }
function lineChart(boxId, pts, opts){
  const box=document.getElementById(boxId); if(!box) return;
  if(!pts.length){ box.innerHTML='<div class="sub">'+(opts.empty||"Sin datos aún.")+'</div>'; return; }
  const W=760,H=opts.h||230,pad={l:44,r:16,t:14,b:30};
  const minV=opts.min!=null? opts.min : 0;
  const maxV=opts.max!=null? opts.max : niceMax(Math.max(...pts.map(p=>p.v))*1.1);
  const X=i=> pts.length===1? (pad.l+(W-pad.l-pad.r)/2) : pad.l+(W-pad.l-pad.r)*i/(pts.length-1);
  const Y=v=> (H-pad.b)-(H-pad.t-pad.b)*(Math.min(Math.max(v,minV),maxV)-minV)/(maxV-minV);
  let s=svgOpen(W,H);
  if(opts.band) s+='<rect x="'+pad.l+'" y="'+Y(opts.band[1])+'" width="'+(W-pad.l-pad.r)+'" height="'+(Y(opts.band[0])-Y(opts.band[1]))+'" fill="var(--s3)" opacity="0.15"/>';
  s+=chartFrame(W,H,pad);
  for(let i=0;i<=3;i++){
    const v=Math.round(minV+(maxV-minV)*(3-i)/3);
    s+='<text x="'+(pad.l-8)+'" y="'+(pad.t+(H-pad.t-pad.b)*i/3+4)+'" text-anchor="end" font-size="11" fill="var(--muted)" style="font-variant-numeric:tabular-nums">'+v+'</text>';
  }
  let path="";
  pts.forEach((p,i)=>{ path+=(i?"L":"M")+X(i)+","+Y(p.v); });
  s+='<path d="'+path+'" fill="none" stroke="'+opts.color+'" stroke-width="2" stroke-linejoin="round"/>';
  pts.forEach((p,i)=>{
    s+='<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="5" fill="'+opts.color+'" stroke="var(--surface-1)" stroke-width="2" data-tip="'+esc(fmtDate(p.date)+": "+p.v+(opts.unit||""))+'"/>';
  });
  const lp=pts[pts.length-1];
  s+='<text x="'+X(pts.length-1)+'" y="'+(Y(lp.v)-10)+'" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">'+lp.v+(opts.unit||"")+'</text>';
  s+='<text x="'+pad.l+'" y="'+(H-8)+'" font-size="11" fill="var(--muted)">'+fmtDate(pts[0].date)+'</text>';
  if(pts.length>1) s+='<text x="'+(W-pad.r)+'" y="'+(H-8)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+fmtDate(lp.date)+'</text>';
  s+='</svg>';
  box.innerHTML=s; bindTips(boxId);
}
function draw1RM(){
  if(!document.getElementById("chart1rm")) return;
  const pts=[]; let isBW=false;
  for(const s of S.sessions){
    if(s.type!=="fuerza") continue;
    const ex=(s.exercises||[]).find(e=>e.exId===progExId);
    if(!ex||!ex.sets.length) continue;
    let val = ex.mode==="w"? Math.max(...ex.sets.map(x=>est1RM(x.w,x.r))) : Math.max(...ex.sets.map(x=>x.r||0));
    isBW = ex.mode!=="w";
    if(val) pts.push({date:s.date, v:val});
  }
  pts.sort((a,b)=>a.date<b.date?-1:1);
  lineChart("chart1rm", pts, {color:"var(--s1)", unit:isBW?" reps":" lb", empty:"Sin datos aún para este ejercicio."});
}
function drawZ2(){
  const pts=S.sessions.filter(s=>s.type==="cardio"&&["trabajo","zona2"].includes(s.cardio.kind)&&s.cardio.hrAvg)
    .map(s=>({date:s.date, v:s.cardio.hrAvg}))
    .sort((a,b)=>a.date<b.date?-1:1);
  lineChart("chartz2", pts, {color:"var(--s2)", unit:" bpm", min:90, max:150, band:[115,125], h:220,
    empty:"Cierra tu primer día con cardio y aquí empieza la curva."});
}
function drawRHR(){
  const pts=Object.keys(S.days).sort().filter(k=>S.days[k].saved && S.days[k].salud && S.days[k].salud.rhr)
    .map(k=>({date:k, v:+S.days[k].salud.rhr}));
  lineChart("chartrhr", pts, {color:"var(--s3)", unit:" bpm", min:50, max:75, band:[57,58], h:220,
    empty:"Anota el RHR en el cierre del día y aquí verás si el experimento está funcionando."});
}
function isoWeek(dateISO){
  const [y,m,d]=dateISO.split("-").map(Number);
  const dt=new Date(Date.UTC(y,m-1,d));
  const day=(dt.getUTCDay()+6)%7;
  dt.setUTCDate(dt.getUTCDate()-day+3);
  const firstThu=new Date(Date.UTC(dt.getUTCFullYear(),0,4));
  const fday=(firstThu.getUTCDay()+6)%7;
  firstThu.setUTCDate(firstThu.getUTCDate()-fday+3);
  const wk=1+Math.round((dt-firstThu)/(7*24*3600*1000));
  return dt.getUTCFullYear()+"-S"+String(wk).padStart(2,"0");
}
function drawWeeks(){
  const box=document.getElementById("chartwk"); if(!box) return;
  const weeks={};
  for(const s of S.sessions){
    const wk=isoWeek(s.date);
    weeks[wk]=weeks[wk]||{f:0,c:0};
    if(s.type==="fuerza"&&s.routineId!=="M") weeks[wk].f++;
    if(s.type==="cardio") weeks[wk].c++;
  }
  const keys=Object.keys(weeks).sort().slice(-8);
  if(!keys.length){ box.innerHTML='<div class="sub">Sin sesiones aún.</div>'; return; }
  const W=760,H=200,pad={l:34,r:16,t:14,b:30};
  const maxV=Math.max(7,...keys.map(k=>Math.max(weeks[k].f,weeks[k].c)));
  const bw=Math.min(28,(W-pad.l-pad.r)/keys.length/3);
  const Y=v=>(H-pad.b)-(H-pad.t-pad.b)*v/maxV;
  let s=svgOpen(W,H)+chartFrame(W,H,pad);
  for(let i=0;i<=3;i++){
    const v=Math.round(maxV*(3-i)/3);
    s+='<text x="'+(pad.l-8)+'" y="'+(pad.t+(H-pad.t-pad.b)*i/3+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+v+'</text>';
  }
  keys.forEach((k,i)=>{
    const cx=pad.l+(W-pad.l-pad.r)*(i+0.5)/keys.length;
    const d=weeks[k];
    if(d.f) s+='<rect x="'+(cx-bw-1)+'" y="'+Y(d.f)+'" width="'+bw+'" height="'+((H-pad.b)-Y(d.f))+'" rx="4" fill="var(--s1)" data-tip="'+k+': '+d.f+' fuerza"/>';
    if(d.c) s+='<rect x="'+(cx+1)+'" y="'+Y(d.c)+'" width="'+bw+'" height="'+((H-pad.b)-Y(d.c))+'" rx="4" fill="var(--s2)" data-tip="'+k+': '+d.c+' cardio"/>';
    s+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" font-size="10.5" fill="var(--muted)">'+k.slice(5)+'</text>';
  });
  s+='</svg>';
  box.innerHTML=s; bindTips("chartwk");
}
</script>
<script>
/* ---------- VISTA: DATOS ---------- */
function viewDatos(){
  let h='<h2>Datos</h2>';
  h+='<div class="card"><b>Exportar para el chat de salud</b>'
    +'<div class="sub">El resumen de texto trae los cierres del día listos para pegar.</div>'
    +'<div class="row" style="margin-top:10px">'
    +'<button onclick="exportText()">📋 Copiar resumen</button>'
    +'<button onclick="exportCSV()">⬇️ CSV fuerza</button>'
    +'<button onclick="exportDaysCSV()">⬇️ CSV días</button></div>'
    +'<div class="sub" id="expMsg" style="margin-top:6px"></div></div>';
  h+='<div class="card"><b>Copia de seguridad</b>'
    +'<div class="sub">Respaldo completo en JSON. Impórtalo si cambias de dispositivo.</div>'
    +'<div class="row" style="margin-top:10px">'
    +'<button onclick="backupJSON()">⬇️ Descargar respaldo</button>'
    +'<button onclick="document.getElementById(\'importFile\').click()">⬆️ Importar respaldo</button>'
    +'<input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importJSON(this)"></div></div>';
  h+='<div class="card"><b>Ajustes</b>'
    +'<label class="f">Descanso entre pares (segundos)</label>'
    +'<input type="number" inputmode="numeric" value="'+(S.settings.restSec||90)+'" style="width:120px" onchange="S.settings.restSec=parseInt(this.value)||90;saveState()">'
    +'</div>';
  h+='<div class="card"><b>La regla del esfuerzo (1–5)</b>'
    +'<div class="sub" style="margin-top:6px">Al terminar cada ejercicio marcas del 1 al 5. '
    +'<b>1</b> = la app sube peso, reps o resistencia en la siguiente sesión, sin esperar. '
    +'<b>2</b> = +1 rep. <b>3–4</b> = progresión normal. '
    +'<b>5</b> = mantiene o baja. Lo verás como una nota 📈 la próxima vez que abras ese ejercicio.</div></div>';
  h+='<div class="card"><b>Cómo funciona ahora</b>'
    +'<div class="sub" style="margin-top:6px">1. <b>6 am:</b> abre <b>Entrenar → Cardio Trabajo</b> y sigue el guion. No registres nada ahí.<br>'
    +'2. <b>Mar/Jue/Sáb:</b> la sesión de fuerza. Puedes seguirla en vivo o solo hacerla y anotarla al final.<br>'
    +'3. <b>En la noche:</b> pestaña <b>Cierre</b> — un solo registro de todo el día.<br>'
    +'4. <b>Domingo:</b> ⬇️ respaldo + 📋 copiar resumen y pégalo en el chat de salud.</div></div>';
  h+='<div class="sub" style="text-align:center;margin:20px 0">Modo Atleta v'+APP_VERSION+' · plan Fase 2 (sep 2026)</div>';
  return h;
}
function fmtSets(ex){ return ex.sets.map(x=>setLabel(ex.mode,x)).join(", "); }
function exportText(){
  let out="MODO ATLETA — export "+todayISO()+"\n";
  const dates=Object.keys(S.days).filter(k=>S.days[k].saved).sort();
  for(const d of dates) out+="\n"+cierreText(d);
  const extra=S.sessions.filter(s=>s.src!=="cierre");
  if(extra.length){
    out+="\n\n== Sesiones registradas en vivo ==\n";
    for(const s of extra.sort((a,b)=>a.date<b.date?-1:1)){
      out+="["+s.date+" · "+s.name+"] ";
      if(s.type==="fuerza"){
        out+="\n";
        for(const ex of s.exercises) out+="  - "+ex.name+": "+fmtSets(ex)+"\n";
      } else out+=sessionSummary(s)+"\n";
    }
  }
  copyOrDownload(out, "modo-atleta-resumen.txt", "Resumen copiado ✓");
}
function csvEsc(v){ v=String(v==null?"":v); return /[",\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; }
function exportCSV(){
  let rows=[["fecha","rutina","ejercicio","serie","peso_lb","reps","segundos","banda","1rm_est","esfuerzo_1a5"]];
  for(const s of S.sessions){
    if(s.type!=="fuerza") continue;
    for(const ex of s.exercises){
      ex.sets.forEach((st,i)=>{
        rows.push([s.date,s.name,ex.name,i+1,st.w??"",st.r??"",st.s??"",st.band??"",
          (ex.mode==="w"&&st.w&&st.r)?est1RM(st.w,st.r):"", ex.rpe??""]);
      });
    }
  }
  downloadFile(rows.map(r=>r.map(csvEsc).join(",")).join("\n"), "modo-atleta-fuerza.csv","text/csv");
}
function exportDaysCSV(){
  let rows=[["fecha","cardio_min","fc_prom","fc_max","ciclos","incl_max","burst5","rutina","proteina_g","pasos","creatina","mcgill","sueno_h","sleep_score","hrv","rhr","espalda","piel","nota"]];
  for(const k of Object.keys(S.days).sort()){
    const d=S.days[k]; if(!d.saved) continue;
    rows.push([k, d.cardio.done? (d.cardio.min||""):"", d.cardio.hrAvg||"", d.cardio.hrMax||"", d.cardio.cycles||"",
      d.cardio.incline||"", d.cardio.surge5?"sí":"", d.fuerza.routineId||"", d.habitos.prot||"", d.habitos.pasos||"",
      d.habitos.crea?"sí":"", d.habitos.mcgill?"sí":"", d.salud.sleepH,
      d.salud.sleepScore, d.salud.hrv, d.salud.rhr, d.salud.espalda, d.salud.piel, d.nota||""]);
  }
  downloadFile(rows.map(r=>r.map(csvEsc).join(",")).join("\n"), "modo-atleta-dias.csv","text/csv");
}
function backupJSON(){
  downloadFile(JSON.stringify({app:"modoAtleta",version:APP_VERSION,exported:new Date().toISOString(),data:S},null,1),
    "modo-atleta-respaldo.json","application/json");
}
function importJSON(input){
  const f=input.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const obj=JSON.parse(rd.result);
      const data=obj.data||obj;
      if(!Array.isArray(data.sessions)) throw new Error("formato");
      if(!confirm("Importar respaldo con "+data.sessions.length+" sesiones. ¿Reemplazar los datos actuales?")) return;
      S=data; S.settings=S.settings||{restSec:90}; S.checklist=S.checklist||{}; S.days=S.days||{};
      saveState(); render(); alert("Respaldo importado ✓");
    }catch(e){ alert("No pude leer ese archivo. ¿Es el respaldo JSON de Modo Atleta?"); }
  };
  rd.readAsText(f);
}
function downloadFile(content,name,type){
  try{
    const blob=new Blob([content],{type:type+";charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},400);
  }catch(e){ copyOrDownload(content,name,"Copiado al portapapeles ✓"); }
}
function copyOrDownload(text,name,okMsg){
  const done=()=>{ const m=document.getElementById("expMsg"); if(m){ m.textContent=okMsg; setTimeout(()=>{const x=document.getElementById("expMsg"); if(x)x.textContent="";},4000);} else alert(okMsg); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ alert("No pude copiar — usa la descarga."); }
  ta.remove();
}

/* ---------- Init ---------- */
if(S.active){ TAB="entrenar"; SUB=null; }
render();
</script>
